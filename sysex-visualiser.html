// ═══════════════════════════════════════════════════════════════════
// Web MIDI — receive a SysEx dump straight from the Digitone II
// ═══════════════════════════════════════════════════════════════════
// The device decides when a dump starts and ends; the computer can only
// listen. (The DN2 has no known "send me the whole project" command —
// verified by reading digitone2.morukutsu.fr's bundle, which has exactly
// one request builder, for a single pattern.) So: user presses START here,
// then triggers SYSEX DUMP on the device.
//
// We DO know the end marker though: a project dump finishes with a short
// message of type 0x54. That is auto-detected, and the manual stop button
// remains as a fallback for pattern-only dumps, which have no trailer.
const MSG_PATTERN = 0x50, MSG_TRAILER = 0x54;
const PATTERN_BYTES = 114118;

let MIDI_ACCESS=null, MIDI_INPUT=null;
let RX = {active:false, msgs:[], bytes:0, t0:0, sawTrailer:false};

async function ensureMidi(){
  if(MIDI_ACCESS) return MIDI_ACCESS;
  if(!navigator.requestMIDIAccess) throw new Error(
    'This browser has no Web MIDI. Chrome, Edge or Opera are known to work; '+
    'Safari and Firefox do not support SysEx over Web MIDI.');
  // sysex:true is REQUIRED — without it the browser silently filters
  // every F0..F7 message and the receiver would look broken.
  MIDI_ACCESS = await navigator.requestMIDIAccess({sysex:true});
  return MIDI_ACCESS;
}

async function openMidiPanel(){
  let inputs=[];
  let err=null;
  try{
    const acc=await ensureMidi();
    inputs=[...acc.inputs.values()];
  }catch(e){ err=e.message||String(e); }

  if(err){
    showModal('MIDI unavailable', esc(err), [{label:'Close',desc:'',fn:()=>closeModal()}]);
    return;
  }
  if(!inputs.length){
    showModal('No MIDI inputs',
      'No MIDI input ports were found. Connect the Digitone II over USB, then reopen this dialog.',
      [{label:'Retry',desc:'',fn:()=>{closeModal(); MIDI_ACCESS=null; openMidiPanel();}},
       {label:'Close',desc:'',fn:()=>closeModal()}]);
    return;
  }

  const opts=inputs.map((p,i)=>
    `<option value="${i}"${MIDI_INPUT&&MIDI_INPUT.id===p.id?' selected':''}>${esc(p.name)}</option>`).join('');

  showModal('Receive SysEx dump from Digitone II',
    'Pick the input port, press <b>Start receiving</b>, then on the device choose '+
    '<b>SYSEX DUMP &rarr; PROJECT</b> (or PATTERN) and send.<br>'+
    'A project dump ends with a trailer message and stops automatically; '+
    'for anything else press <b>Dump done</b> when the device reports it has finished.',
    [
      {label:'Start receiving', desc:'Arm the listener, then start the dump on the device.', fn:()=>startRx()},
      {label:'Dump done', desc:'Stop listening and process what arrived.', fn:()=>stopRx()},
      {label:'Close', desc:'', fn:()=>{ if(RX.active) stopRx(true); closeModal(); }},
    ],
    `<div class="ctl" style="margin-bottom:10px">
       <label style="font-size:11px;color:var(--muted)">INPUT PORT</label>
       <select id="midiPort">${opts}</select>
     </div>
     <div id="rxStatus" class="rxbox">
       <div class="rxline"><span id="rxPhase">idle</span><span id="rxCount"></span></div>
       <div class="rxbar"><div id="rxFill" class="rxfill" style="width:0%"></div></div>
       <div class="rxlog" id="rxLog"></div>
     </div>`);
  MIDI_PORTS=inputs;
}
let MIDI_PORTS=[];

function rxSet(phase,detail){
  const ph=document.getElementById('rxPhase'); if(ph) ph.textContent=phase;
  const c=document.getElementById('rxCount'); if(c) c.textContent=detail||'';
}
function rxLog(msg){
  const l=document.getElementById('rxLog');
  if(!l) return;
  const d=document.createElement('div');
  d.textContent=msg;
  l.appendChild(d); l.scrollTop=l.scrollHeight;
}
function rxProgress(){
  // A full project is 128 patterns + trailer. Before we know the kind of
  // dump, show progress against that; a pattern dump simply completes early.
  const pct=Math.min(100, Math.round(RX.msgs.length/129*100));
  const f=document.getElementById('rxFill'); if(f) f.style.width=pct+'%';
  const mb=(RX.bytes/1024/1024).toFixed(2);
  rxSet(RX.sawTrailer?'complete':'receiving',
        `${RX.msgs.length} msg · ${mb} MB`);
}


function startListening(port){
  RX={active:true, msgs:[], bytes:0, t0:performance.now(), sawTrailer:false};
  port.onmidimessage=onMidiMessage;
  document.getElementById('midiBadge').style.display='';
  rxSet('listening','waiting for the device…');
  rxLog(`listening on "${port.name}" — now start the dump on the Digitone II`);
  console.log('SysEx listener attached to port:', port);
  rxProgress();
}

function startRx(){
  if(!MIDI_ACCESS){
    rxLog('MIDI not initialized — requesting access...');
    navigator.requestMIDIAccess({sysex:true}).then(access => {
      MIDI_ACCESS = access;
      populateMidiPorts();
      startRx(); // retry after access granted
    }).catch(err => rxLog('MIDI access denied: '+err));
    return;
  }
  const sel=document.getElementById('midiPort');
  if(!sel){ rxLog('no midiPort element'); return; }
  const port=MIDI_PORTS[+sel.value];
  if(!port){ rxLog('no port selected'); return; }
  if(MIDI_INPUT) MIDI_INPUT.onmidimessage=null;
  MIDI_INPUT=port;

  // More robust attachment using statechange
  const attachListener = () => {
    RX = {active:true, msgs:[], bytes:0, t0:performance.now(), sawTrailer:false};
    port.onmidimessage = onMidiMessage;
    document.getElementById('midiBadge').style.display = '';
    rxSet('listening', 'waiting for the device…');
    rxLog(`listening on "${port.name}" — now start the dump on the Digitone II`);
    console.log('%c[LISTENER ATTACHED]', 'color:#0a0', port);
    rxProgress();
  };

  if (port.connection === 'open') {
    attachListener();
  } else {
    port.onstatechange = (ev) => {
      if (ev.port.connection === 'open') {
        attachListener();
        port.onstatechange = null;
      }
    };
    port.open().catch(err => {
      rxLog('Failed to open port: ' + err);
    });
  }
  document.getElementById('midiBadge').style.display='';
  rxSet('listening','waiting for the device…');
  rxLog(`listening on "${port.name}" — now start the dump on the Digitone II`);
  console.log('SysEx listener attached to port:', port);
  rxProgress();
}

function onMidiMessage(ev){
  console.log('%c[MIDI]', 'color:#0a0', ev.data);
  if(!RX.active) { console.log('%c[RX inactive]', 'color:#a00'); return; }
  const d = ev.data;
  console.log('%c[DATA]', 'color:#08f', Array.from(d).map(b => b.toString(16).padStart(2,'0')).join(' '));
  if(!d || d.length < 7 || d[0] !== 0xF0) return;
  console.log('%c[SYSEX]', 'color:#0a0', Array.from(d).map(b => b.toString(16).padStart(2,'0')).join(' '));
  
  if(d[1]!==0x00 || d[2]!==0x20 || d[3]!==0x3C){
    rxLog('non-Elektron SysEx ignored');
    return;
  }
  if(d[4]!==PRODUCT_DN2){
    rxLog(`ignored: product 0x${d[4].toString(16)} (not Digitone II)`);
    return;
  }
  const type=d[6];
  RX.msgs.push(new Uint8Array(d));
  RX.bytes+=d.length;
  if(type===MSG_PATTERN)      rxLog(`#${RX.msgs.length} PATTERN ${d.length} B`);
  else if(type===MSG_TRAILER) rxLog(`#${RX.msgs.length} TRAILER ${d.length} B`);
  else                        rxLog(`#${RX.msgs.length} type 0x${type.toString(16)} ${d.length} B`);
  rxProgress();

  // A project dump ends with the 0x54 trailer.
  if(type===MSG_TRAILER && RX.msgs.length>1){
    RX.sawTrailer=true;
    rxLog('trailer detected — dump complete');
    setTimeout(()=>stopRx(),150);
  }
}

function stopRx(silent){
  if(!RX.active){ if(!silent) rxLog('not receiving'); return; }
  RX.active=false;
  if(MIDI_INPUT) MIDI_INPUT.onmidimessage=null;
  document.getElementById('midiBadge').style.display='none';
  if(silent) return;
  if(!RX.msgs.length){ rxSet('idle','nothing received'); rxLog('no messages captured'); return; }

  const total=RX.msgs.reduce((a,m)=>a+m.length,0);
  const buf=new Uint8Array(total);
  let o=0; for(const m of RX.msgs){ buf.set(m,o); o+=m.length; }
  const nPat=RX.msgs.filter(m=>m[6]===MSG_PATTERN).length;
  const secs=((performance.now()-RX.t0)/1000).toFixed(1);
  closeModal();

  showModal('Dump received',
    `${RX.msgs.length} message(s), ${nPat} pattern(s), `+
    `${(total/1024/1024).toFixed(2)} MB in ${secs}s.<br>What would you like to do?`,
    [
      {label:'Load into the editor', desc:'Decode it now. Nothing is written to disk.',
       fn:()=>{ closeModal(); loadFromBytes(buf,'MIDI dump'); }},
      {label:'Save .syx and load', desc:'Write the raw dump to a file, then decode it.',
       fn:()=>{ closeModal(); saveBytesAsSyx(buf); loadFromBytes(buf,'MIDI dump'); }},
      {label:'Save .syx only', desc:'Write the raw dump to a file and keep the current view.',
       fn:()=>{ closeModal(); saveBytesAsSyx(buf); }},
      {label:'Discard', desc:'Throw the captured dump away.', fn:()=>closeModal()},
    ]);
}

function defaultSyxName(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return `DN2-dump-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.syx`;
}
function saveBytesAsSyx(bytes,name){
  download(bytes, name||defaultSyxName(), 'application/octet-stream');
}

// Save whatever is currently loaded back out as a .syx.
// NOTE: this writes the ORIGINAL bytes as received/opened. In-app edits are
// NOT serialised, because the checksum/repack path is unverified — writing a
// bad checksum would produce a file the device silently rejects.
function saveProjectSyx(){
  if(!PATTERNS.length){ alert('Nothing loaded to save.'); return; }
  if(!DIRTY){ saveBytesAsSyx(RAW_SOURCE, RAW_NAME); return; }
  showModal('Save .syx',
    '<b class="dirty">In-memory edits detected.</b><br>Choose how to save.',
    [
      {label:'Save with edits (repacked + checksum)',
       desc:'Repacks every pattern with current edits and recomputes all checksums.',
       fn:()=>{ closeModal(); saveEditedSyx(); }},
      {label:'Save original bytes',
       desc:'Write the unmodified dump as loaded. Edits are discarded.',
       fn:()=>{ closeModal(); saveBytesAsSyx(RAW_SOURCE, RAW_NAME); }},
      {label:'Save current pattern only',
       desc:'Repack and checksum just the current pattern.',
       fn:()=>{ closeModal(); saveEditedPattern(); }},
      {label:'Cancel', desc:'', fn:()=>closeModal()},
    ]);
}

function saveEditedSyx(){
  try{
    const buf=buildSyxProject();
    saveBytesAsSyx(buf, RAW_NAME||defaultSyxName());
    DIRTY=false; document.getElementById('dirtyBadge').style.display='none';
    RAW_SOURCE=buf;
    document.getElementById('status').textContent='Saved with edits';
  }catch(e){ alert('Failed: '+(e.message||String(e))); }
}

function saveEditedPattern(){
  const p=curPattern(); if(!p||!p.ok){ alert('No pattern.'); return; }
  try{
    const bytes=buildSyxForPattern(p);
    // bytes is already F0..F7 (114118 bytes)
    const name=(p.patternName||p.label||'pattern').replace(/[^\w\-]+/g,'_')+'.syx';
    saveBytesAsSyx(bytes,name);
    document.getElementById('status').textContent='Saved single pattern';
  }catch(e){ alert('Failed: '+(e.message||String(e))); }
}

let MODAL_ACTIONS=[];
function showModal(title,sub,actions,bodyHtml){
  MODAL_ACTIONS=actions;
  const el=document.createElement('div');
  el.className='overlay'; el.id='ov';
  el.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><div class="sub">${sub}</div>
    ${bodyHtml||''}
    <div class="row">${actions.map((a,i)=>
      `<button class="opt ${i===0?'accent':''}" onclick="MODAL_ACTIONS[${i}].fn()"><b>${esc(a.label)}</b>${a.desc?`<span>${esc(a.desc)}</span>`:''}</button>`
    ).join('')}</div></div>`;
  document.body.appendChild(el);
}
function closeModal(){
  const e=document.getElementById('ov');
  if(!e) return;
  // Let a dialog tear down anything it attached to document (see wireLenShift).
  if(typeof e._lenShiftOff==='function'){ try{ e._lenShiftOff(); }catch(_){} }
  e.remove();
}

          note for that step. Exports of retrigged patterns are not accurate. Nothing is lost in the
          file itself.</td></tr>
        <tr><td>synth machine choice</td><td>${M('FM TONE',0)}, ${M('FM DRUM',2)},
          ${M('WAVETONE',1)} and ${M('SWARMER',3)} are identified, but their parameters live in
          preset data. Only audio ↔ ${M('MIDI',4)} can be changed.</td></tr>
        <tr><td>sound parameters</td><td>filter, amp, FX and LFO settings are not decoded</td></tr>
        <tr><td>presets and kits</td><td>names are shown, and preset and MIDI track names are
          written back when they change; the sounds themselves live in the project's preset pool,
          which is not part of a pattern dump</td></tr>
      </table>

      <h4>Keyboard</h4>
      <table class="helptab">
        <tr><td><b>Cmd-Z</b> / <b>Ctrl-Z</b></td><td>undo the last edit</td></tr>
        <tr><td><b>Esc</b></td><td>close a dialog; if none is open, shrink an expanded track</td></tr>
        <tr><td><b>?</b> or <b>H</b></td><td>open this help</td></tr>
        <tr><td><b>Shift</b> + length list</td><td>in the note editor, hold Shift while opening the
          length dropdown to see only the common note divisions</td></tr>
      </table>

    </div>`);
  // Drop the "more below" fade once the reader reaches the end, so it does
  // not sit there implying content that is not there.
  const hw=document.querySelector('.helpwrap');
  if(hw) hw.addEventListener('scroll',()=>{
    hw.classList.toggle('atend', hw.scrollTop+hw.clientHeight >= hw.scrollHeight-4);
  });
}
// ── Global keys ───────────────────────────────────────────────────────
// Esc closes any open dialog first, then shrinks an expanded track.
document.addEventListener('keydown',e=>{
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((e.target&&e.target.tagName)||'');
  if(e.key==='Escape'){
    if(document.getElementById('ov')){
      if(RX.active) stopRx(true);      // don't leave the MIDI listener armed
      closeModal();
      e.preventDefault();
      return;
    }
    if(shrinkAll()) e.preventDefault();
    return;
  }
  // Cmd-Z / Ctrl-Z. Checked BEFORE the `typing` guard is used to bail, but
  // still skipped while a field has focus so it undoes the browser's own
  // text editing rather than the pattern.
  if((e.metaKey||e.ctrlKey) && (e.key==='z'||e.key==='Z') && !e.shiftKey){
    if(typing || document.getElementById('ov')) return;
    if(canUndo()){ undoLast(); e.preventDefault(); }
    return;
  }
  if(typing) return;
  if(e.key==='?'||e.key==='h'||e.key==='H'){
    if(!document.getElementById('ov')){ showHelp(); e.preventDefault(); }
  }
});

// Edit the current pattern's name (in memory only)
function editPatternName(){
  const p=curPattern(); if(!p||!p.ok) return;
  const cur=p.patternName||'';
  showModal('Edit pattern name',
    '<input id="editPnInput" class="nname" value="'+esc(cur)+'" style="width:100%;font-size:15px;padding:8px" maxlength="16">'+
    '<br><span style="font-size:10px;color:var(--muted)">A-Z, 0-9, space, hyphen. Uppercased by device. 16 chars max.</span>',
    [
      {label:'Save', desc:'Apply the new name.',
       fn:()=>{
         const v=document.getElementById('editPnInput').value.trim().toUpperCase().slice(0,16);
         p.patternName=v||undefined;
         markDirty(); closeModal(); render();
       }},
      {label:'Cancel', desc:'', fn:()=>closeModal()},
    ]);
}


// Manual §10.11.1 (p.49): "When you extend the length of a pattern, its trigs
// copies automatically over to the new steps" (device setting AUTO COPY).
// Shrinking is non-destructive — trigs beyond the end are kept, unplayed.
function editPatternLength(){
  const p=curPattern(); if(!p||!p.ok) return;
  const cur=p.patternLength||16;
  showModal('Pattern length',
    'Up to '+MAX_STEPS+' steps over '+MAX_PAGES+' pages of '+STEPS_PER_PAGE+' '+
    '(manual §10.11). Shortening keeps the trigs past the new end — they '+
    'simply stop playing, exactly as on the device.',
    [
      {label:'Apply', desc:'Set the pattern length.',
       fn:()=>{
         const el=document.getElementById('editPlInput');
         const v=parseInt(el.value,10);
         if(!Number.isFinite(v)||v<1||v>MAX_STEPS){
           // Validate in place — do not close and lose the value.
           el.style.borderColor='var(--danger)';
           const w=document.getElementById('editPlWarn');
           if(w) w.innerHTML='<b class="dirty">Length must be 1–'+MAX_STEPS+' steps.</b>';
           return;
         }
         if(v===cur){ closeModal(); return; }

         if(v>cur){
           // GROWING — offer the device's AUTO COPY behaviour.
           closeModal();
           showModal('Extend to '+v+' steps',
             'The pattern is '+cur+' steps. On the device, extending copies the '+
             'existing trigs into the new pages (AUTO COPY, §10.11.1).',
             [
               {label:'Copy existing trigs', desc:'Repeats the first '+cur+' steps to fill '+(cur+1)+'–'+v+'.',
                fn:()=>applyGrow(v,true)},
               {label:'Leave new steps empty', desc:'Extends the length; the added steps have no trigs.',
                fn:()=>applyGrow(v,false)},
               {label:'Cancel', desc:'', fn:()=>closeModal()},
             ]);
           return;
         }

         // SHRINKING — non-destructive. Say what it means, then just do it.
         const beyond=trigsBeyond(p,v);
         if(beyond.length){
           closeModal();
           showModal('Reduce to '+v+' steps',
             beyond.length+' trig(s) sit beyond step '+v+':<br>'+
             '<span class="sub">'+esc(beyond.slice(0,12).join(', '))+(beyond.length>12?' …':'')+'</span>'+
             '<br><br>They are <b>kept</b> and stop playing, matching the device. '+
             'Growing the pattern again brings them back.',
             [
               {label:'Shorten', desc:'Set the length to '+v+'. Nothing is deleted.',
                fn:()=>{ setPatternLength(v); closeModal(); }},
               {label:'Cancel', desc:'', fn:()=>closeModal()},
             ]);
           return;
         }
         setPatternLength(v); closeModal();
       }},
      {label:'Cancel', desc:'', fn:()=>closeModal()},
    ],
    '<div id="editPlWarn" style="font-size:10px;color:var(--muted)">1–'+MAX_STEPS+' steps</div>'+
    '<input id="editPlInput" class="nname" value="'+cur+'" style="width:100%;font-size:15px;padding:8px;margin-top:8px" type="number" min="1" max="'+MAX_STEPS+'" step="1">');
}


// Item 8 — add SEVERAL tracks at once. The single-track dropdown became a
// checkbox list of every free slot, so making four MIDI tracks is one dialog
// instead of four. Also replaces the window.alert for "all 16 in use".
function showAddTrack(){
  const p=curPattern(); if(!p||!p.ok) return;

  const used = new Set(Object.keys(p.tracks).map(Number));
  const available = [];
  for(let i=1; i<=16; i++){
    if(!used.has(i)) available.push(i);
  }
  if(available.length === 0){
    showModal('No free tracks','All 16 tracks are already in use. Delete a track first.',
      [{label:'OK',desc:'',fn:()=>closeModal()}]);
    return;
  }

  const boxes = available.map(t =>
    `<label class="tsel"><input type="checkbox" class="newTrk" value="${t}"${t===available[0]?' checked':''}> T${t}</label>`
  ).join('');

  showModal('Add tracks',
    'Tick every track you want to create. They are added empty; '+available.length+' slot'+(available.length===1?' is':'s are')+' free.',
    [
      {label:'Add selected', desc:'Create the ticked tracks.',
       fn:()=>{
         const want=[...document.querySelectorAll('#addTrkList .newTrk:checked')].map(c=>+c.value);
         if(!want.length){
           const w=document.getElementById('addTrkWarn');
           if(w) w.innerHTML='<b class="dirty">Tick at least one track.</b>';
           return;
         }
         const steps = parseInt(document.getElementById('newTrackSteps').value,10) || 16;
         const isMidi = document.getElementById('newTrackIsMidi').checked;
         // Channel only means anything on a MIDI track. '' = leave OFF, which
         // is a real state on the device, not "unset".
         const chRaw = document.getElementById('newTrackChan').value;
         const chan = (isMidi && chRaw!=='') ? parseInt(chRaw,10) : null;
         const made = addTracks(want, {steps, isMidi, chan});
         if(made && !p.perTrackMode) p.perTrackMode = true;
         closeModal(); render();
       }},
      {label:'Cancel', desc:'', fn:()=>closeModal()}
    ],
    `<div id="addTrkWarn" style="font-size:10px;color:var(--muted)">free slots</div>
     <div id="addTrkList" class="tsellist">${boxes}</div>
     <div style="margin-top:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
       <label style="font-size:11px">Steps
         <input id="newTrackSteps" type="number" value="16" min="1" max="128" style="width:70px;margin-left:4px"></label>
       <label style="font-size:11px"><input type="checkbox" id="newTrackIsMidi" onchange="document.getElementById('newTrackChanWrap').style.display=this.checked?'inline-flex':'none'"> MIDI track(s)</label>
       <label id="newTrackChanWrap" style="font-size:11px;display:none;align-items:center;gap:4px">Channel
         <select id="newTrackChan" style="margin-left:2px">
           <option value="">OFF</option>
           ${[...Array(16)].map((_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}
         </select></label>
       <button class="mini expbtn" onclick="document.querySelectorAll('#addTrkList .newTrk').forEach(c=>c.checked=true)">all</button>
       <button class="mini expbtn" onclick="document.querySelectorAll('#addTrkList .newTrk').forEach(c=>c.checked=false)">none</button>
     </div>`);
}

function render(){
  const main=document.getElementById('main');
  if(!PATTERNS.length) return;
  const p=curPattern();

  if(p.notPattern||!p.ok){
    main.innerHTML=`<div class="err"><b>Cannot decode ${esc(p.label)}</b><br>${esc(p.error||'')}</div>`;
    document.getElementById('status').textContent=`${p.label} — ${p.error||'error'}`;
    return;
  }

  const patLen=p.patternLength||16;
  document.getElementById('lenBadge').textContent =
    `${patLen} steps` + (p.perTrackMode?' · per-track':' · pattern-wide');
  // (BPM used to be mirrored into a toolbar input here; the Tempo card in
  //  row 3 renders it directly now, so there is nothing to sync.)

  const trkVal=document.getElementById('trkSel').value;
  const tracks= trkVal==='all' ? Object.keys(p.tracks).map(Number) : [ +trkVal ];
  const totalTrigs=Object.values(p.tracks).reduce((a,s)=>a+s.length,0);
  const totalNotes=p.records.length;

  let html='';
  html+=`<div class="info">
    <div class="card"><div class="k">Pattern name</div><div class="v ok" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px" onclick="editPatternName()" title="Click to rename">${esc(p.patternName||'(unnamed)')}</div></div>
    <div class="card"><div class="k">Kit name</div><div class="v">${esc(p.kitName||'(unnamed)')}</div></div>
    <div class="card" id="tempoCard"><div class="k">Tempo</div><div class="v acc" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px" onclick="editTempo()" title="Click to change the tempo">${(p.bpm||120).toFixed(1)} BPM</div></div>
    <div class="card" onclick="editPatternLength()" title="Click to edit length"><div class="k">Pattern length</div><div class="v acc" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px">${patLen} steps${p.perTrackMode?' (per-track)':''}</div></div>
    <div class="card"><div class="k">Active tracks</div><div class="v">${Object.keys(p.tracks).length} <button onclick="showAddTrack()" class="mini expbtn" style="margin-left:6px;font-size:10px;padding:1px 6px">+ Add</button></div></div>
    <div class="card"><div class="k">Trigs</div><div class="v">${totalTrigs}</div></div>
    <div class="card"><div class="k">Notes (incl. chords)</div><div class="v ${totalNotes>totalTrigs?'acc':''}">${totalNotes}</div></div>
  </div>`;

  // Track names — collapsible; the state persists across re-renders.
  html+=`<div class="gridwrap"><div class="gridtitle namehdr">`
      + `Track names`
      + `<button class="mini expbtn nametoggle" onclick="toggleNames()" title="${NAMES_OPEN?'Collapse':'Expand'} the track names table">`
      + `${NAMES_OPEN?'▲ hide':'▼ show'}</button></div>`
      + `<div class="namesbody" style="${NAMES_OPEN?'':'display:none'}"><div class="nameflex"><table class="names">`;
  html+='<tr><th></th><th>PRESET / MIDI CH</th><th>MACHINE</th></tr>';
  for(let t=1;t<=16;t++){
    const exists = !!p.tracks[t];
    const hasTrig=p.tracks[t]&&p.tracks[t].length>0;
    const pn = p.presetNames[t-1] || '';
    // Decoded from the machine id, NOT from a name — every track carries a
    // default MIDI name whether or not it is a MIDI track.
    const isMidi = isMidiTrack(p,t);
    const mach = trackMachine(p,t);
    let cls=['m'+mach];
    if(hasTrig) cls.push('act');
    if(isMidi) cls.push('midi');

    // Column 1 answers "what is on this track": the preset name for a synth
    // machine, the channel it sends on for a MIDI machine. A MIDI track's
    // preset name is meaningless, and a synth track has no channel.
    //
    // A track that does not EXIST says EMPTY -- there is nothing to report.
    // A track that exists but has no trigs still shows its channel or preset,
    // otherwise adding a MIDI track on channel 5 would read "EMPTY" and the
    // setting you just chose would be invisible.
    let preCell;
    if(!exists){
      preCell = '<span style="color:var(--muted)">EMPTY</span>';
    } else if(isMidi){
      const ch = midiChannel(p,t);
      preCell = (ch===null||ch===undefined)
        ? '<span style="color:var(--muted)">CH OFF</span>'
        : `CH ${ch}`;
    } else {
      preCell = pn ? esc(pn) : `<span style="color:var(--muted)">PRESET ${t}</span>`;
    }
    // Both value cells open the type/channel editor. Existing tracks only —
    // there is nothing to edit on a slot that holds no track.
    const edit = exists ? ` class="ttedit" onclick="showTrackType(${t})" title="Edit track type and MIDI channel"` : '';
    html+=`<tr class="${cls.join(' ')}"><td class="tn">T${t}</td><td${edit}>${preCell}</td>`
        + `<td${edit}>${machineName(p,t)}</td></tr>`;
  }
  html+='</table>';
  // Pattern stats fill the space beside the names table.
  {
    const synthN=[...Array(16)].filter((_,i)=>{
      const t=i+1; return p.tracks[t]&&p.tracks[t].length && !isMidiTrack(p,t);
    }).length;
    const midiN=[...Array(16)].filter((_,i)=>{
      const t=i+1; return p.tracks[t]&&p.tracks[t].length && isMidiTrack(p,t);
    }).length;
    const activeN=Object.keys(p.tracks).filter(t=>p.tracks[t].length).length;
    const triglessN=Object.values(p.triglessAt||{}).reduce((a,v)=>a+v.length,0);
    const chordSteps=Object.values(p.notesAt||{})
      .reduce((a,steps)=>a+Object.values(steps).filter(n=>n.length>1).length,0);
    const microN=(p.records||[]).filter(r=>r.micro).length;
    const lenMode=p.perTrackMode?'per-track':'pattern-wide';
    const row=(k,v,cls)=>`<div class="srow"><span>${k}</span><b class="${cls||''}">${v}</b></div>`;
    html+=`<div class="patstats">
      <div class="statshdr statstitle">Pattern stats</div>
      ${row('Slot',esc(p.slot||p.label||'—'))}
      ${row('Name',esc(p.patternName||'—'))}
      ${row('Kit',esc(p.kitName||'—'))}
      ${row('Tempo',(p.bpm?p.bpm.toFixed(1):'—')+' BPM')}
      ${row('Length',patLen+' steps ('+(patLen/16).toFixed(patLen%16?1:0)+' bar'+(patLen===16?'':'s')+')')}
      ${row('Length mode',lenMode)}
      <div class="statshdr">Content</div>
      ${row('Active tracks',activeN+' / 16')}
      ${row('· synth / MIDI',synthN+' / '+midiN)}
      ${row('Trigs',totalTrigs)}
      ${row('Notes',totalNotes,totalNotes>totalTrigs?'acc':'')}
      ${row('Chord steps',chordSteps)}
      ${row('Trigless trigs',triglessN,triglessN?'yel':'')}
      ${row('Microtimed',microN)}
    </div>`;
  }
  html+='</div>';                                     // .nameflex
  html+='<div class="legend">'
      + '<span class="act">highlighted = has trigs</span> · '
      + '<span class="m0">■ FM TONE</span>'
      + '<span class="m2">■ FM DRUM</span>'
      + '<span class="m1">■ WAVETONE</span>'
      + '<span class="m3">■ SWARMER</span>'
      + '<span class="m4">■ MIDI</span>'
      + '</div></div></div>';

  if(!tracks.length) html+=`<div class="gridwrap"><div class="gridtitle">No active trigs in this pattern</div></div>`;

  for(const t of tracks){
    const steps=p.tracks[t]||[];
    const notesFor=s=>(p.notesAt[t]&&p.notesAt[t][s])||[];
    // Header follows the track's machine colour, so "TRACK 1" and its
    // preset name read the same as that track's row in the names table.
    // A MIDI track shows its channel: a preset name means nothing there.
    const mach = trackMachine(p,t);
    const headLbl = isMidiTrack(p,t)
      ? (midiChannel(p,t)==null ? 'CH OFF' : 'CH '+midiChannel(p,t))
      : (p.presetNames[t-1] || '');
    const pn = headLbl ? ` <span class="pname m${mach}">${esc(headLbl)}</span>` : '';
    // Each track renders its OWN length in 'detected' mode; an explicit view
    // size overrides it.
    const tLen = effectiveTrackLength(p,t);
    const nSteps = VIEW_STEPS || tLen;
    const beyondN=steps.filter(s=>s>nSteps).length;
    const isBig = (EXPANDED===t);
    const tl = p.perTrackMode
      ? `<span class="tlen">${tLen} steps</span>`
      : `<span class="tlen follows">follows project (${patLen})</span>`;
    const spd = p.trackSpeeds[t];
    const spdSel = `<select class="mini" onchange="setTrackSpeed(${t},this.value)" title="per-track speed">`
      + SPEED_LABEL.map((l,i)=>`<option value="${i}"${spd===i?' selected':''}>${l}</option>`).join('')
      + `</select>`;
    const pageStops=[16,32,48,64,80,96,112,128];
    const lenSel = `<select class="mini" onchange="setTrackLength(${t},this.value)" title="per-track length">`
      + pageStops.map(v=>`<option value="${v}"${tLen===v?' selected':''}>${v}</option>`).join('')
      + (pageStops.includes(tLen)?'':`<option value="${tLen}" selected>${tLen}</option>`)
      + `<option value="custom">custom…</option></select>`;
    const addBtn = `<button class="mini expbtn" onclick="showAddTrack()" title="Add a new track">+ Add track</button>`;
    // Type/channel editing lives beside the other per-track controls, and
    // opens the same dialog as clicking the row in the track names table.
    const typBtn = `<button class="mini expbtn" onclick="showTrackType(${t})" title="Change track type (audio/MIDI) and MIDI channel">type</button>`;
    // Clear (keep the track, drop its trigs) sits next to Delete (remove the
    // track entirely) so the difference is visible at the point of choosing.
    const clrBtn = `<button class="mini expbtn" onclick="clearTrack(${t})" title="Remove every trig but keep the track">clear</button>`;
    const dupBtn = `<button class="mini expbtn" onclick="showDuplicateTrack(${t})" title="Copy this track's trigs to another track">duplicate</button>`;
    const delBtn = `<button class="mini delbtn" onclick="deleteTrack(${t})" title="Delete this track entirely">🗑</button>`;
    const expBtn = `<button class="mini expbtn" onclick="toggleExpand(${t})" title="${isBig?'shrink this track (Esc)':'expand this track 4x'}">`
      + `${isBig?'⤡ shrink':'⤢ expand'}</button>`;

    html+=`<div class="gridwrap${isBig?' big':''}" id="trk${t}"><div class="gridtitle"><span class="m${mach}">Track ${t}</span>${pn} <span class="cnt">${steps.length} trigs</span> ${tl}`
        + ` <span class="tctl">len ${lenSel} speed ${spdSel} ${typBtn} ${clrBtn} ${dupBtn} ${delBtn} ${expBtn}</span>`
        + (beyondN?` <span class="dirty">· ${beyondN} beyond step ${nSteps}</span>`:'') + `</div>`;

    // When expanded, wrap long sequences into rows of 64 so a 128-step
    // pattern stays readable instead of scrolling off to the right.
    const ROW = isBig ? 64 : nSteps;
    for(let rowStart=1; rowStart<=nSteps; rowStart+=ROW){
      const rowEnd=Math.min(nSteps,rowStart+ROW-1);
      if(isBig && nSteps>ROW)
        html+=`<div class="rowlbl">steps ${rowStart}–${rowEnd}</div>`;
      html+='<table class="seq">';

      html+='<tr><td class="lbl"></td>';
      for(let s=rowStart;s<=rowEnd;s++)
        html+=`<th class="${(s-1)%16===0?'bar':''}">${(s-1)%4===0?s:''}</th>`;
      html+='</tr>';

      // TRIG lane — dots, clickable; SHIFT-click restores a remembered trig
      html+='<tr><td class="lbl">Trig</td>';
      for(let s=rowStart;s<=rowEnd;s++){
        const cls=['cell']; if((s-1)%16===0)cls.push('bar'); else if((s-1)%4===0)cls.push('beat');
        if(s>tLen) cls.push('beyond');
        const on=steps.includes(s);
        const nn=notesFor(s);
        const stash=hasStash(p,t,s);
        if(!on&&stash) cls.push('stashed');
        const hasNotes=nn.length>0;
        // DEVICE trigless trig: step-state byte a = 0x78. It occupies the step
        // and stores a full record, but sounds NO note — the record's note 60
        // is inert, which is why the editor used to show a phantom C5 here.
        const devTrigless=!!(p.isTrigless&&p.isTrigless(t,s));
        // Orphan: notes stored with no trig bit (a different, app-side case).
        const orphan=!on&&hasNotes;
        if(on&&hasNotes&&!devTrigless) cls.push('has-notes');
        if(devTrigless) cls.push('devtrigless');
        if(orphan) cls.push('trigless');
        const tip=devTrigless
          ? `T${t} step ${s} — TRIGLESS TRIG (parameter automation, no note) — click to remove`
          : (on
            ? `T${t} step ${s} · ${hasNotes?nn.map(r=>noteName(r.note)).join(' '):'default'} — click to remove`
            : (orphan
                ? `T${t} step ${s} — notes stored, no trig — click to add trig`
                : (stash
                    ? `T${t} step ${s} — click for a default trig, SHIFT-click to restore the previous one`
                    : `T${t} step ${s} — empty — click to add a trig`)));
        let dotSpan='';
        if(devTrigless) dotSpan=`<span class="dot devtrigless" title="trigless trig — parameter automation, no note"></span>`;
        else if(on&&hasNotes) dotSpan=`<span class="dot with-notes" title="trig with notes"></span>`;
        else if(on) dotSpan=`<span class="dot" title="trig (default)"></span>`;
        else if(orphan) dotSpan=`<span class="ghost trigless" title="notes stored, no trig"></span>`;
        else if(stash) dotSpan=`<span class="ghost stashed" title="previous trig remembered"></span>`;
        else dotSpan=`<span class="ghost" title="empty"></span>`;
        html+=`<td class="${cls.join(' ')}" title="${esc(tip)}" onclick="toggleTrig(${t},${s},event.shiftKey)">${dotSpan}</td>`;
      }
      html+='</tr>';

      // NOTE lane — click opens the editor; ring marks a chord
      if(LANES.note){
        html+='<tr><td class="lbl">Note</td>';
        for(let s=rowStart;s<=rowEnd;s++){
          const cls=['cell']; if((s-1)%16===0)cls.push('bar'); else if((s-1)%4===0)cls.push('beat');
          if(s>tLen) cls.push('beyond');
          const nn=notesFor(s);
          const devTrigless=!!(p.isTrigless&&p.isTrigless(t,s));
          const chord=nn.length>1?' chord':'';
          // A trigless trig stores a note but never sounds it. Showing that
          // note as an ordinary note dot was the phantom C5. Showing NOTHING,
          // though, hid the fact that the step carries a note at all — so an
          // edit there looked like it had done nothing, which is half of why
          // "edited notes are not received" was so hard to see. Show the note,
          // in trigless yellow, and say plainly that it will not sound.
          if(devTrigless){
            const lbl = nn.length
              ? `T${t} step ${s} · ${nn.map(r=>noteName(r.note)).join(', ')} — TRIGLESS: stored but NOT played. Edit the note to make this step sound.`
              : `T${t} step ${s} — trigless trig: parameter automation, no note`;
            html+=`<td class="${cls.join(' ')} devtrigless" title="${esc(lbl)}" onclick="openNoteEditor(${t},${s})">`
                + (nn.length?`<span class="dot notetrigless${chord}"></span>`:`<span class="ghost devtrigless"></span>`)+`</td>`;
            continue;
          }
          const tip=nn.length?`T${t} step ${s} · ${nn.map(r=>noteName(r.note)+(r.vel!==INHERIT?` v${r.vel}`:'')).join(', ')} — click to edit`
                             :`T${t} step ${s} — no notes`;
          html+=`<td class="${cls.join(' ')}" title="${esc(tip)}" onclick="openNoteEditor(${t},${s})">`
              + (nn.length?`<span class="dot note${chord}"></span>`:`<span class="ghost"></span>`)+`</td>`;
        }
        html+='</tr>';
      }

      // VALUE lanes. Velocity drags; Length and Micro open the note dialog.
      //
      // Micro shows DIRECTION, not a bar: `<` nudges early (negative), `>` late
      // (positive), `<>` when a chord on the step spans both directions — the
      // strum case. Unset/centred stays a ghost.
      const microMark=nn=>{
        const vals=nn.map(r=>r.micro||0);
        const neg=vals.some(v=>v<0), pos=vals.some(v=>v>0);
        if(neg&&pos) return '<>';
        if(neg) return '<';
        if(pos) return '>';
        return null;
      };
      // Length is scaled by DURATION, not by raw code. The code index is not
      // linear in time -- code 14 is 1 step, code 62 is 8 -- so norming on the
      // code produced a bar that looked meaningless. Log scale over the useful
      // musical range: empty ~ 1/64 step, full = 8 steps (INF pins full).
      const LEN_LO=Math.log(0.25), LEN_HI=Math.log(8);
      const lenNorm=code=>{
        const st=LEN_STEPS[code];
        if(st==null) return 1;                       // INF
        const v=(Math.log(Math.max(st,0.25))-LEN_LO)/(LEN_HI-LEN_LO);
        return Math.max(0,Math.min(1,v));
      };
      // A chord's notes may differ in length; the bar shows their average, the
      // tooltip names each one.
      const lenAvg=nn=>{
        const cs=nn.map(r=>r.len).filter(c=>c!==INHERIT);
        if(!cs.length) return null;
        return cs.reduce((a,c)=>a+lenNorm(c),0)/cs.length;
      };
      // The step cell is ~32px, narrower than a label like "1/64", so the lane
      // shows a COMPACT form and the tooltip carries the exact value.
      // Sub-step values use a leading "/" ("/64") so they read unambiguously as
      // a fraction -- an earlier "·64" was mistaken for a decimal.
      const lenShort=code=>{
        const st=LEN_STEPS[code];
        if(st==null) return '\u221e';                  // INF
        if(st<1)  return '/'+String(Math.round(1/st)); // 1/64 step -> /64
        if(st>=100) return '99+';
        return Number.isInteger(st) ? String(st) : st.toFixed(1).replace(/\.0$/,'');
      };
      const laneDefs=[
        {key:'micro', label:'Micro', color:'var(--mute)', micro:true},
        {key:'vel', label:'Velocity', color:'var(--vel)', get:r=>r.vel, txt:r=>r.vel, norm:v=>v/127, drag:true},
        {key:'len', label:'Length',   color:'var(--len)', get:r=>r.len, txt:r=>lenShort(r.len), norm:lenNorm, drag:false, isLen:true},
      ];
      for(const L of laneDefs){
        if(!LANES[L.key]) continue;
        html+=`<tr><td class="lbl">${L.label}</td>`;
        for(let s=rowStart;s<=rowEnd;s++){
          const cls=['vcell']; if((s-1)%16===0)cls.push('bar'); else if((s-1)%4===0)cls.push('beat');
          if(s>tLen) cls.push('beyond');
          const nn=notesFor(s);
          const devTrigless=!!(p.isTrigless&&p.isTrigless(t,s));
          const act = L.drag
            ? ` onmousedown="startVelDrag(event,${t},${s})"`
            : ` onclick="openNoteEditor(${t},${s})"`;
          if(!nn.length){ html+=`<td class="${cls.join(' ')}"></td>`; continue; }

          if(L.micro){
            // Microtiming applies to the note a trig sounds; a trigless trig
            // sounds none, so leave its cell blank rather than implying timing.
            const mark = devTrigless ? null : microMark(nn);
            if(!mark){
              const tip = devTrigless
                ? `step ${s}: trigless trig — no note to nudge`
                : `step ${s}: microtiming centred — click to edit`;
              html+=`<td class="${cls.join(' ')}" title="${esc(tip)}"${act}><span class="inherit">·</span></td>`;
              continue;
            }
            const detail=nn.filter(r=>r.micro).map(r=>`${noteName(r.note)} ${r.micro>0?'+':''}${r.micro}/384`).join(', ');
            const tip=`step ${s}: ${detail}${mark==='<>'?' — strum across the grid line':''} — click to edit`;
            html+=`<td class="${cls.join(' ')} vclick micro-cell" title="${esc(tip)}"${act}>`
                + `<span class="micro-mark ${mark==='<>'?'both':(mark==='<'?'early':'late')}">${mark==='<>'?'&lt;&gt;':(mark==='<'?'&lt;':'&gt;')}</span></td>`;
            continue;
          }

          if(devTrigless){
            html+=`<td class="${cls.join(' ')}" title="${esc(`step ${s}: trigless trig — ${L.label.toLowerCase()} not used`)}"${act}><span class="inherit">·</span></td>`;
            continue;
          }
          cls.push(L.drag?'vdrag':'vclick');
          const r=nn[0], raw=L.get(r);
          const more=nn.length>1?` (+${nn.length-1})`:'';
          if(raw===INHERIT){
            const tip=L.drag?`step ${s}: inherits track default — drag up/down to set a velocity`
                            :`step ${s}: inherits track default — click to edit`;
            html+=`<td class="${cls.join(' ')}" title="${esc(tip)}"${act}><span class="inherit">·</span></td>`;
            continue;
          }
          const barH = isBig ? 46 : 26;
          // Length averages across a chord (its notes may differ); velocity is
          // already uniform per step, so nn[0] speaks for it.
          const nv = (L.isLen ? lenAvg(nn) : L.norm(raw));
          const h=Math.max(3,Math.round((nv==null?0:nv)*barH));
          const lenDetail = L.isLen && nn.length>1
            ? ` [${nn.map(r=>lenName(r.len)).join(', ')}]` : '';
          // The cell text is abbreviated; the tooltip states the real value.
          const tip=L.drag?`step ${s}: velocity ${raw}${more} — drag up/down to change`
                          :`step ${s}: length ${lenName(r.len)}${more}${lenDetail} — click to edit`;
          html+=`<td class="${cls.join(' ')}${L.isLen?' len-cell':''}" title="${esc(tip)}"${act}>`
              + `<div class="bar-fill" style="height:${h}px;background:${L.color};opacity:.8"></div>`
              + `<span class="vtxt">${esc(String(L.txt(r)))}</span></td>`;
        }
        html+='</tr>';
      }
      html+='</table>';
    }

    html+=`<div class="legend">
      <span><i style="background:var(--trig)"></i>trig — click toggles, SHIFT-click restores the previous trig</span>
      <span><i style="background:var(--note)"></i>note — click to edit</span>
      <span>◎ ring on a note dot = chord</span>
      <span><i style="background:var(--trigless)"></i>trigless trig — plays no note, carries locks only</span>
      <span><i style="background:var(--vel)"></i>velocity — drag up/down</span>
      <span><i style="background:var(--len)"></i>length — click to edit</span>
      <span><b style="color:#7ee787">&lt;</b> early · <b style="color:#ff8fa3">&gt;</b> late · <b style="color:var(--accent2)">&lt;&gt;</b> strum — microtiming, 1/384 note</span>
      <span>· = inherits track default</span>
      ${nSteps>tLen?`<span class="dirty">dimmed = beyond track length ${tLen}</span>`:''}
    </div></div>`;
  }

  main.innerHTML=html;
  try { updateCurrentPatternInSel(); } catch(e) {}
  try { refreshTrackSel(); } catch(e) {}
  document.getElementById('status').textContent =
    `${p.label}${p.patternName?` [${p.patternName}]`:''} — length ${patLen}, viewing ${VIEW_STEPS||patLen} steps, `+
    `${Object.keys(p.tracks).length} track(s), ${totalTrigs} trigs, ${totalNotes} notes`+
    (DIRTY?' — EDITED (in memory only)':'');

  // Capture the settled state for one-level undo. Nothing has been edited at
  // this point, so this snapshot is the "before" of whatever happens next.
  // Re-arming here is what lets each successive action be undoable.
  RENDER_SNAP = snapshotPattern(p);
  UNDO_ARMED = false;
  const ub=document.getElementById('undoBtn');
  if(ub) ub.disabled=!canUndo();
}

// Send a pattern to a specific MIDI output port.
// pi: pattern index in PATTERNS[], ti: track ('all' or '1'-'16'), di: dest slot 0-127
async function sendPatternToPort(portIdx, pi, ti, di){
  if(!MIDI_ACCESS) await ensureMidi();
  const outs=[...MIDI_ACCESS.outputs.values()];
  if(!outs[portIdx]){ alert('MIDI port not found.'); return; }
  const out=outs[portIdx];

  const p=PATTERNS.filter(x=>!x.notPattern)[pi];
  if(!p||!p.ok){ alert('Pattern not found.'); return; }

  // Show progress — keep dialog open
  const prog=document.getElementById('sendProgress');
  const phase=document.getElementById('sendPhase');
  const fill=document.getElementById('sendFill');
  const log=document.getElementById('sendLog');
  const doneBtn=document.getElementById('sendDoneBtn');
  if(prog) prog.style.display='';
  if(phase) phase.textContent='building…';
  if(fill) fill.style.width='0%';
  if(log) log.innerHTML='';
  if(doneBtn) doneBtn.style.display='none';

  function slog(msg){
    const d=document.createElement('div'); d.textContent=msg;
    if(log){ log.appendChild(d); log.scrollTop=log.scrollHeight; }
  }

  try{
    // Build
    const bytes=buildSyxForPattern(p);
    // MAJOR BUG (v22.34): this used to write `bytes[9]=di` and recompute the
    // checksum, presenting a "destination slot" the device does not honour.
    //
    // MANUAL (OS1.10D §13.5.2, p.77): "PATTERN will store a received pattern
    // to the SELECTED pattern slot." Byte 9 does NOT place the pattern — the
    // slot armed on the DEVICE does. The regression lab confirmed this on
    // hardware on 2026-09-01: patterns sent "to C01..C04" all landed at the
    // armed slot A01 onwards.
    //
    // So the picker was actively misleading: a user editing A01, sending it
    // "to slot 5", and then checking slot 5 heard no change — while their
    // edit had in fact overwritten whatever slot the device had selected.
    // From the chair: "edited notes not received on HW".
    //
    // buildSyxForPattern leaves byte 9 at 0 deliberately; do not touch it.
    const kB=(bytes.length/1024).toFixed(1);
    slog('1 message · '+bytes.length+' bytes ('+kB+' kB)');
    slog('\u26a0 Lands in the slot SELECTED ON THE DEVICE, not a slot chosen here.');
    slog('   Select the destination pattern on the DN2 before sending.');

    // Round-trip verification: does the payload we're about to send reproduce
    // the device's own dump? (Slot + checksum are ignored by design.)
    const rt=roundTripReport(p);
    if(rt.error){
      slog('\u26a0 Round-trip check skipped: '+rt.error);
    } else if(rt.ok){
      slog('\u2713 Round-trip OK \u2014 rebuilt payload matches the source dump');
    } else {
      const parts=[];
      if(rt.reg.step)  parts.push(rt.reg.step+' step-state');
      if(rt.reg.trig)  parts.push(rt.reg.trig+' trig-record');
      if(rt.reg.name)  parts.push(rt.reg.name+' name');
      if(rt.reg.other) parts.push(rt.reg.other+' metadata');
      slog('\u26a0 Round-trip WARNING \u2014 rebuilt payload differs from the source dump');
      slog('   '+rt.total+' byte(s) differ'+(parts.length?' ('+parts.join(', ')+')':''));
      if(rt.first>=0) slog('   first at decoded 0x'+rt.first.toString(16)+' in '+rt.firstRegion);
      slog(DIRTY
        ? '   pattern has in-memory edits \u2014 some differences are expected'
        : '   pattern is UNMODIFIED \u2014 the rebuild path is lossy for this data');
    }

    if(phase) phase.textContent='checksum…';
    if(fill) fill.style.width='30%';

    // Send
    slog('Sending to '+esc(out.name)+'…');
    if(phase) phase.textContent='sending…';
    if(fill) fill.style.width='60%';
    out.send(bytes);

    // Success
    if(fill) fill.style.width='100%';
    if(phase) phase.textContent='sent!';
    slog('Sent pattern \"'+esc(p.patternName||p.label)+'\" to '+esc(out.name)+' → slot '+di);
    if(doneBtn) doneBtn.style.display='';
    document.getElementById('status').textContent='Sent pattern to '+out.name+' (slot '+di+')';
  }catch(e){
    if(phase) phase.textContent='failed';
    if(fill) fill.style.width='0%';
    slog('ERROR: '+(e.message||String(e)));
    if(doneBtn) doneBtn.style.display='';
  }
}

// ── Round-trip logging helper (shared by single and multi send) ──
function logRoundTrip(slog, p){
  const rt=roundTripReport(p);
  if(rt.error){ slog('\u26a0 Round-trip check skipped: '+rt.error); return; }
  if(rt.ok){ slog('\u2713 Round-trip OK \u2014 rebuilt payload matches the source dump'); return; }
  const parts=[];
  if(rt.reg.step)  parts.push(rt.reg.step+' step-state');
  if(rt.reg.trig)  parts.push(rt.reg.trig+' trig-record');
  if(rt.reg.name)  parts.push(rt.reg.name+' name');
  if(rt.reg.other) parts.push(rt.reg.other+' metadata');
  slog('\u26a0 Round-trip WARNING \u2014 '+rt.total+' byte(s) differ'+(parts.length?' ('+parts.join(', ')+')':''));
}

const sleep = ms => new Promise(r=>setTimeout(r,ms));
let SEND_ABORT=false;

// Wait for the DN2 to answer with any Elektron SysEx (00 20 3C ...) on the
// matching input port, or resolve false on timeout. Used by ACK-wait mode.
function waitForAck(inPort, timeoutMs){
  return new Promise(resolve=>{
    if(!inPort){ resolve({ok:false, reason:'no input port'}); return; }
    let done=false;
    const t0=performance.now();
    const prev=inPort.onmidimessage;
    const finish=(ok,reason)=>{
      if(done) return; done=true;
      inPort.onmidimessage=prev;               // restore any prior listener
      clearTimeout(tid);
      resolve({ok, reason, ms:Math.round(performance.now()-t0)});
    };
    inPort.onmidimessage=ev=>{
      const d=ev.data;
      if(d && d.length>=5 && d[0]===0xF0 && d[1]===0x00 && d[2]===0x20 && d[3]===0x3C)
        finish(true,'ack');
    };
    const tid=setTimeout(()=>finish(false,'timeout'), timeoutMs);
  });
}

// Try to pair the chosen OUTPUT port with its matching INPUT port by name, so
// ACK-wait can listen where the device replies. Falls back to the first input.
async function matchingInputFor(out){
  if(!MIDI_ACCESS) await ensureMidi();
  const ins=[...MIDI_ACCESS.inputs.values()];
  if(!ins.length) return null;
  const norm=x=>String(x||'').toLowerCase().replace(/\s+/g,' ').trim();
  const on=norm(out&&out.name);
  let best=ins.find(i=>norm(i.name)===on)
        || ins.find(i=>on&&(norm(i.name).includes(on)||on.includes(norm(i.name))))
        || ins[0];
  return best||null;
}

// ── Sequential multi-pattern send ──
// The DN2 in SYSEX DUMP > RECEIVE stores each incoming pattern then waits for
// the next until cancelled, so we stream a queue back-to-back. Between patterns
// we either wait a fixed GAP, or (ACK-wait) wait for the device's SysEx reply
// with a timeout fallback so a silent RECEIVE mode still makes progress.
// queue: [{pi, di}]  (pi = index into patOnly, di = destination slot 0-127)
async function sendPatternSequence(portIdx, queue, opts){
  if(!MIDI_ACCESS) await ensureMidi();
  const outs=[...MIDI_ACCESS.outputs.values()];
  if(!outs[portIdx]){ alert('MIDI port not found.'); return; }
  const out=outs[portIdx];
  const patOnly=PATTERNS.filter(x=>!x.notPattern);
  const useAck=!!opts.useAck, delayMs=opts.delayMs, timeoutMs=opts.timeoutMs;
  const inPort=useAck ? await matchingInputFor(out) : null;

  const prog=document.getElementById('sendProgress');
  const phase=document.getElementById('sendPhase');
  const fill=document.getElementById('sendFill');
  const log=document.getElementById('sendLog');
  const doneBtn=document.getElementById('sendDoneBtn');
  const stopBtn=document.getElementById('sendStopBtn');
  if(prog) prog.style.display='';
  if(fill) fill.style.width='0%';
  if(log) log.innerHTML='';
  if(doneBtn) doneBtn.style.display='none';
  if(stopBtn) stopBtn.style.display='';
  SEND_ABORT=false;
  function slog(msg){ const d=document.createElement('div'); d.textContent=msg;
    if(log){ log.appendChild(d); log.scrollTop=log.scrollHeight; } }

  const BANKS='ABCDEFGH';
  const slotLabel=di=>BANKS[(di>>4)&7]+String((di%16)+1).padStart(2,'0');

  slog('Queue: '+queue.length+' pattern(s) \u00b7 '+(useAck?('ACK-wait, '+timeoutMs+'ms timeout'):(delayMs+'ms gap')));
  if(useAck) slog(inPort ? ('Listening for ACK on "'+esc(inPort.name)+'"') : 'No input port found \u2014 ACK-wait will fall back to timeout.');
  slog('Keep the device in SYSEX DUMP \u203a RECEIVE the whole time.');
  let ackSilent=false;                          // once the device proves silent, stop waiting full timeouts
  let sent=0, warned=0, failed=0;
  try{
    for(let k=0;k<queue.length;k++){
      if(SEND_ABORT){ slog('\u23f9 Aborted after '+sent+' pattern(s).'); break; }
      const {pi,di}=queue[k];
      const p=patOnly[pi];
      if(phase) phase.textContent='sending '+(k+1)+'/'+queue.length+'\u2026';
      if(fill) fill.style.width=Math.round(k/queue.length*100)+'%';
      if(!p||!p.ok){ slog('\u2717 #'+(k+1)+' skipped \u2014 not decodable'); failed++; continue; }
      const nm=(p.slot||p.label||('P'+(pi+1)))+(p.patternName?' \u00b7 '+p.patternName:'');
      try{
        const bytes=buildSyxForPattern(p);
        // Byte 9 is NOT a destination (see sendPatternToPort). The device
        // stores each received pattern to its currently SELECTED slot and
        // advances from there, so a queue lands consecutively from whatever
        // the DN2 is sitting on. Writing a slot here achieved nothing except
        // making the log claim a destination that was not honoured.
        const rt=roundTripReport(p);
        if(!rt.ok && !rt.error) warned++;
        const flag=rt.error?' \u26a0(check skipped)':(rt.ok?'':' \u26a0('+rt.total+'B differ)');
        out.send(bytes);
        sent++;
        slog('\u2192 #'+(k+1)+'/'+queue.length+'  '+nm+flag);
      }catch(e){ failed++; slog('\u2717 #'+(k+1)+' '+nm+' \u2014 ERROR: '+(e.message||String(e))); }

      if(k<queue.length-1){
        if(useAck && inPort && !ackSilent){
          const a=await waitForAck(inPort, timeoutMs);
          if(a.ok) slog('   \u2713 ACK ('+a.ms+'ms)');
          else { slog('   \u26a0 no ACK in '+timeoutMs+'ms \u2014 device is silent in RECEIVE; switching to '+delayMs+'ms gaps'); ackSilent=true; await sleep(delayMs); }
        } else {
          await sleep(delayMs);
        }
      }
    }
    if(fill) fill.style.width='100%';
    if(phase) phase.textContent=SEND_ABORT?'aborted':'done';
    slog('\u2500\u2500 Finished: '+sent+' sent'+(warned?', '+warned+' round-trip warning(s)':'')+(failed?', '+failed+' failed':''));
    slog('Now cancel SYSEX DUMP \u203a RECEIVE on the device.');
    document.getElementById('status').textContent='Sent '+sent+' pattern(s) to '+out.name;
  }catch(e){
    if(phase) phase.textContent='failed';
    slog('FATAL: '+(e.message||String(e)));
  }finally{
    if(stopBtn) stopBtn.style.display='none';
    if(doneBtn) doneBtn.style.display='';
  }
}

// Read the send dialog and dispatch to single or multi send.
function startSendFromDialog(){
  const portEl=document.getElementById('sendPortSel');
  const si=+portEl.value;
  if(portEl.value===''||isNaN(si)){ alert('No MIDI output port selected.'); return; }
  const mode=document.getElementById('sendModeSel').value;
  if(mode==='single'){
    const pi=+document.getElementById('sendPatSel').value;
    const ti=document.getElementById('sendTrkSel').value;
    const di=+document.getElementById('sendSlotSel').value;
    sendPatternToPort(si, pi, ti, di);
    return;
  }
  const checks=[...document.querySelectorAll('.sendPatChk:checked')].map(c=>+c.value);
  if(!checks.length){ alert('Select at least one pattern to send.'); return; }
  const destMode=(document.querySelector('input[name="sendDestMode"]:checked')||{}).value||'own';
  const startSlot=+document.getElementById('sendMultiStartSlot').value||0;
  const delayMs=Math.max(0,Math.min(8000,parseInt(document.getElementById('sendDelay').value,10)||500));
  const useAck=(document.querySelector('input[name="sendHandshake"]:checked')||{}).value==='ack';
  const queue=checks.map((pi,k)=>({pi, di: destMode==='own' ? (pi&0x7F) : ((startSlot+k)&0x7F)}));
  sendPatternSequence(si, queue, {useAck, delayMs, timeoutMs:delayMs});
}

// ── Step-state diagnostic ─────────────────────────────────────────────
// TESTLAB.md requires this alongside comparePayloads/roundTripReport: it was
// how the hardware-confirmed encoding was read off a real dump in the first
// place. It lists the raw byte pair behind every step and summarises the
// distinct odd/even trig and idle encodings the loaded dump actually uses,
// so a wrong fallback (the 0x90 bug) is visible without a device.
function stepStateDiag(pi){
  const patOnly=PATTERNS.filter(x=>!x.notPattern);
  const p=(pi===undefined)?curPattern():patOnly[pi];
  if(!p||!p.ok||!p._rawMsg){ alert('Load a decodable pattern first.'); return null; }
  const dec=unpack7(p._rawMsg,PACK_START,PACK_END);
  const hx=v=>v===undefined?'--':'0x'+v.toString(16).padStart(2,'0');
  const seen={oddTrig:{}, evenTrig:{}, oddIdle:{}, evenIdle:{}};
  const rows=[];
  const nSteps=p.patternLength||16;
  for(let t=1;t<=MAX_TRACK;t++){
    const active=p.tracks[t]&&p.tracks[t].length;
    for(let stp=1;stp<=nSteps;stp++){
      const o=ssOffset(t,stp);
      const a=dec[o], b=dec[o+1];
      const trig=isTrig(a,b);
      const key=hx(a)+' '+hx(b);
      const bucket=trig?((stp&1)?seen.oddTrig:seen.evenTrig)
                       :((stp&1)?seen.oddIdle:seen.evenIdle);
      bucket[key]=(bucket[key]||0)+1;
      if(active) rows.push({track:t, step:stp, a, b, trig, parity:(stp&1)?'odd':'even'});
    }
  }
  const summary={
    oddTrig:Object.keys(seen.oddTrig), evenTrig:Object.keys(seen.evenTrig),
    oddIdle:Object.keys(seen.oddIdle), evenIdle:Object.keys(seen.evenIdle),
  };
  const result={pattern:(p.slot||p.label||''), patternLength:nSteps, rows, summary, counts:seen};
  if(typeof console!=='undefined' && console.table) console.log('step-state encodings', summary);
  return result;
}

// ── Payload compare (A vs B) ───────────────────────────────────────────
// The DN2 pattern step encoding is NOT publicly documented, and testing shows
// app-added EVEN steps do not trig on hardware while ODD steps and original
// steps do. That means a trig depends on MORE than the 2-byte step-state entry
// we currently write. This tool byte-diffs the DECODED payloads of two loaded
// patterns so we can capture ground truth: make an all-16 pattern natively ON
// the device (dump = A), save the app-edited all-16 as .syx and load it (= B),
// then compare. Every byte the device sets that the app doesn't will show here.
function comparePayloads(ai, bi){
  const patOnly=PATTERNS.filter(x=>!x.notPattern);
  const A=patOnly[ai], B=patOnly[bi];
  if(!A||!A.ok||!A._rawMsg||!B||!B.ok||!B._rawMsg){ alert('Pick two decodable patterns.'); return; }
  const da=unpack7(A._rawMsg,PACK_START,PACK_END);
  // B is the app's REBUILT payload (what Send would transmit), not B._rawMsg
  // — in-app edits live in p.tracks/notesAt and only exist in bytes after
  // buildSyxForPattern runs. Comparing device-A vs app-built-B is the true test.
  let bBuilt; try{ bBuilt=buildSyxForPattern(B); }catch(e){ alert('Build B failed: '+(e.message||e)); return; }
  const db=unpack7(bBuilt,PACK_START,PACK_END);
  const hx=v=>v===undefined?'--':'0x'+v.toString(16).padStart(2,'0');
  const ssEnd=SS_BASE+SS_TRACK_STRIDE*MAX_TRACK;
  const trigEnd=TRIG_BASE+TRIG_MAX_SLOTS*TRIG_SLOT;
  const nameEnd=PAT_NAME_OFFSET+NAME_LEN;
  const regionOf=i=>(i>=SS_BASE&&i<ssEnd)?'step-state':(i>=TRIG_BASE&&i<trigEnd)?'trig-records':(i>=PAT_NAME_OFFSET&&i<nameEnd)?'name':'metadata';
  const reg={'step-state':0,'trig-records':0,'name':0,'metadata':0};
  const n=Math.min(da.length,db.length); let total=0, firstFew=[];
  for(let i=0;i<n;i++){ if(da[i]===db[i]) continue; total++; reg[regionOf(i)]++;
    if(firstFew.length<40) firstFew.push({i, a:da[i], b:db[i], r:regionOf(i)}); }

  // Step-state table diff: show every step where A and B differ, per track.
  let ssRows='';
  for(let t=1;t<=MAX_TRACK;t++){
    let trackHdr=false;
    for(let stp=1; stp<=Math.min(16,(A.patternLength||B.patternLength||16)); stp++){
      const o=ssOffset(t,stp);
      const aa=da[o],ab=da[o+1],ba=db[o],bb=db[o+1];
      const diff=(aa!==ba)||(ab!==bb);
      const aT=isTrig(aa,ab), bT=isTrig(ba,bb);
      if(!diff && aT===bT) continue;
      if(!trackHdr){ ssRows+=`<tr><td colspan="6" style="color:var(--accent);padding-top:6px"><b>Track ${t}</b></td></tr>`; trackHdr=true; }
      ssRows+=`<tr>`
        +`<td style="text-align:right;color:var(--muted)">${stp}</td>`
        +`<td style="color:${(stp&1)?'var(--accent2)':'var(--note)'}">${(stp&1)?'odd':'even'}</td>`
        +`<td style="font-family:ui-monospace,monospace">${hx(aa)} ${hx(ab)}</td>`
        +`<td>${aT?'TRIG':'idle'}</td>`
        +`<td style="font-family:ui-monospace,monospace;color:${diff?'var(--warn)':'inherit'}">${hx(ba)} ${hx(bb)}</td>`
        +`<td>${bT?'TRIG':'idle'}</td>`
        +`</tr>`;
    }
  }
  if(!ssRows) ssRows='<tr><td colspan="6" style="color:var(--muted)">(step-state entries identical)</td></tr>';

  const firstRows=firstFew.map(d=>`<tr><td style="text-align:right;font-family:ui-monospace,monospace">0x${d.i.toString(16)}</td><td>${d.r}</td><td style="font-family:ui-monospace,monospace">${hx(d.a)}</td><td style="font-family:ui-monospace,monospace;color:var(--warn)">${hx(d.b)}</td></tr>`).join('');

  const summary=
    `<div style="font-size:11px;line-height:1.7;margin-bottom:8px">`
    +`<b>A</b> = ${esc(A.slot||A.label||'A')} &nbsp; <b>B</b> = ${esc(B.slot||B.label||'B')}<br>`
    +`Decoded length A=${da.length} B=${db.length}<br>`
    +`<b>${total}</b> differing byte(s): `
    +`step-state ${reg['step-state']}, trig-records ${reg['trig-records']}, name ${reg['name']}, metadata ${reg['metadata']}`
    +`</div>`
    +`<div style="font-size:11px;color:var(--warn);margin-bottom:8px">If the device-native pattern (A) has bytes set OUTSIDE step-state/trig-records that the app build (B) lacks, that is the missing "trig enable" structure.</div>`;

  showModal('Compare payloads \u2014 A vs B',
    'Byte diff: A = raw device dump, B = app REBUILT payload (what Send transmits). Pick the same musical content in both to see where the app diverges.',
    [{label:'Close', desc:'', fn:()=>closeModal()}],
    summary
    +'<div style="font-weight:600;font-size:11px;margin:6px 0 2px">Step-state differences (A \u2192 B)</div>'
    +'<div style="max-height:230px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;margin-bottom:10px">'
    +'<table style="width:100%;font-size:11px;border-collapse:collapse">'
    +'<tr style="position:sticky;top:0;background:var(--panel2)"><th>Step</th><th>Par</th><th>A bytes</th><th>A</th><th>B bytes</th><th>B</th></tr>'
    +ssRows+'</table></div>'
    +'<div style="font-weight:600;font-size:11px;margin:6px 0 2px">First differing bytes (any region)</div>'
    +'<div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:6px">'
    +'<table style="width:100%;font-size:11px;border-collapse:collapse">'
    +'<tr style="position:sticky;top:0;background:var(--panel2)"><th>Offset</th><th>Region</th><th>A</th><th>B</th></tr>'
    +(firstRows||'<tr><td colspan="4" style="color:var(--muted)">(no differences)</td></tr>')+'</table></div>');
}
