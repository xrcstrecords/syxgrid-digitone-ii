// ── DN2 Regression Lab ──────────────────────────────────────────────
// Hardware-in-the-loop regression harness (TESTLAB.md).
//
// WHY IT LIVES HERE, NOT IN A PYTHON HARNESS: the point is to validate the
// EXACT code path a real user drives —
//   editor state -> buildSyxForPattern() -> WebMIDI -> DN2 -> MIDI capture
// A separate framework that reimplements the encoder would test the copy,
// not the app. Suite generation, slot allocation, capture quantisation and
// verification are therefore pure functions in this file; only transport and
// playback need the device.
//
// The DN2 stays in SYSEX DUMP > RECEIVE PATTERN and auto-advances after each
// pattern, so an entire campaign runs from ONE manual arm operation.

// Length codes for the length matrix. LEN_STEPS is monotonic and 1/16 == 1
// step, so these are the exact division codes the device itself labels.
const LAB_LEN_CODES = {'1/128':0x00, '1/64':0x02, '1/32':0x06, '1/16':0x0E, '1/8':0x1E, '1/4':0x2E};

// Slot plan from TESTLAB.md. Each suite owns a contiguous block so a whole
// campaign can be pushed once and individual cases replayed later by program
// change. base is a 0-127 slot index (0 = A01, 16 = B01, ...).
// NOTE ON TESTLAB.md: the spec asks for A01-A32 / A33-A64 / B01-B32 ... but a
// real DN2 bank is only 16 patterns wide, so those labels overlap and "A33"
// does not exist. The INTENT — one contiguous, non-overlapping, replayable
// block per suite — is preserved, remapped onto real bank boundaries.
// Slot plan: a per-suite block so a run is contiguous and replayable.
//
// IMPORTANT: this is only a LABELLING convention. The device stores a received
// pattern to the slot it is ARMED at (manual 13.5.2), not to anything the plan
// says, so these bases do not place patterns. runCase selects by the tracked
// receive pointer instead. Keep the plan for readable case ids and reporting;
// do not treat `slot` as a destination.
const LAB_SLOT_PLAN = {
  'single-trig':    {base:0,   size:32},   // A01-B16
  'parity':         {base:32,  size:16},   // C01-C16
  'velocity':       {base:48,  size:16},   // D01-D16
  'length':         {base:64,  size:16},   // E01-E16
  'chord':          {base:80,  size:16},   // F01-F16
  'pattern-length': {base:96,  size:16},   // G01-G16
  'multi-track':    {base:112, size:16},   // H01-H16
};

const LAB_SUITES = ['single-trig','parity','velocity','length','chord','pattern-length','multi-track'];

// One trig descriptor: everything the editor needs to place a note.
function labNote(track, step, note, vel, len){
  return {track, step, note:(note===undefined?0x3C:note),
          vel:(vel===undefined?INHERIT:vel), len:(len===undefined?INHERIT:len)};
}

const DN2LAB = (function(){
  const BANKS='ABCDEFGH';
  let RESULTS=[];
  let RUNNING=false;
  let ABORT=false;

  function slotLabel(di){ const n=di&0x7F; return BANKS[(n>>4)&7]+String((n%16)+1).padStart(2,'0'); }

  // A step is one 1/16 note. At 120 BPM a beat is 500 ms, so a step is 125 ms.
  function stepDurationMs(bpm){ return 60000/(bpm||120)/4; }

  // ── Suite generation ────────────────────────────────────────────────
  // Each case: {id, suite, slot, patternLength, expected:[{track,step,note,vel,len}]}
  function allocSlot(suite, index){
    const plan=LAB_SLOT_PLAN[suite];
    if(!plan) return index&0x7F;
    return (plan.base + (index % plan.size)) & 0x7F;
  }

  // 1. Single trig matrix — validate every step location on every track.
  // The full 16x128 grid is 2048 cases; `dense` walks all of it, the default
  // samples the boundaries and a stride so a run stays practical on hardware.
  function suiteSingleTrig(opts){
    const dense=!!(opts&&opts.dense);
    const tracks=dense?Array.from({length:16},(_,i)=>i+1):[1,16];
    const steps=dense?Array.from({length:128},(_,i)=>i+1)
                     :[1,2,3,4,8,15,16,17,32,63,64,65,127,128];
    const cases=[];
    for(const t of tracks) for(const s of steps){
      cases.push({suite:'single-trig', id:`single-T${t}S${s}`,
                  patternLength:s>64?128:(s>32?64:(s>16?32:16)),
                  expected:[labNote(t,s,0x3C)]});
    }
    return cases;
  }

  // 2. Odd/even parity — the guard for the 0x90/0x91 regression. An all-16
  // run is the exact shape that failed: odd steps played, even ones vanished.
  function suiteParity(){
    const cases=[];
    cases.push({suite:'parity', id:'parity-all16', patternLength:16,
      expected:Array.from({length:16},(_,i)=>labNote(1,i+1,0x3C))});
    cases.push({suite:'parity', id:'parity-odd-only', patternLength:16,
      expected:[1,3,5,7,9,11,13,15].map(s=>labNote(1,s,0x3C))});
    cases.push({suite:'parity', id:'parity-even-only', patternLength:16,
      expected:[2,4,6,8,10,12,14,16].map(s=>labNote(1,s,0x3C))});
    cases.push({suite:'parity', id:'parity-all32', patternLength:32,
      expected:Array.from({length:32},(_,i)=>labNote(1,i+1,0x3C))});
    return cases;
  }

  // ── Seeded RNG ──────────────────────────────────────────────────────
  // Random test values catch what fixed ones miss: a hardcoded 127 can be
  // matched by accident, a random 73 cannot. But an unreproducible failure is
  // nearly useless, so the seed is recorded in the report and can be replayed.
  // mulberry32 — small, fast, good enough for choosing test values.
  let LAB_SEED = 0;
  function setSeed(s){ LAB_SEED = (s>>>0) || (Date.now()>>>0); return LAB_SEED; }
  function seed(){ return LAB_SEED; }
  function makeRng(s){
    let a=(s>>>0)||1;
    return function(){
      a=(a+0x6D2B79F5)>>>0;
      let t=a;
      t=Math.imul(t^(t>>>15), t|1);
      t^=t+Math.imul(t^(t>>>7), t|61);
      return ((t^(t>>>14))>>>0)/4294967296;
    };
  }
  const rngInt=(rng,lo,hi)=>lo+Math.floor(rng()*(hi-lo+1));

  // 3. Velocity matrix — random values per run (seeded) plus the boundaries.
  // Fixed values can be matched by accident; random ones cannot.
  function suiteVelocity(opts){
    const rng=makeRng(LAB_SEED^0x5645);           // 'VE'
    const vals=[1,127];                            // boundaries always
    const n=(opts&&opts.velCount)||5;
    while(vals.length<n){
      const v=rngInt(rng,2,126);
      if(!vals.includes(v)) vals.push(v);
    }
    return vals.map(v=>({
      suite:'velocity', id:`vel-${v}`, patternLength:16, velocity:v,
      expected:[labNote(1,1,0x3C,v)]}));
  }

  // 4. Length matrix — note duration per division code. A random subset each
  // run plus the shortest and longest, so a wrong code cannot hide behind a
  // lucky match. Verified by measuring note-on to note-off on the wire.
  function suiteLength(opts){
    const rng=makeRng(LAB_SEED^0x4C45);           // 'LE'
    const keys=Object.keys(LAB_LEN_CODES);
    const pick=[keys[0], keys[keys.length-1]];    // extremes always
    const n=(opts&&opts.lenCount)||6;
    const pool=keys.slice(1,-1);
    while(pick.length<n && pool.length){
      pick.push(pool.splice(rngInt(rng,0,pool.length-1),1)[0]);
    }
    return pick.map(k=>{
      const code=LAB_LEN_CODES[k];
      // LEN_STEPS is the documented code->duration table; the expectation is
      // stated in STEPS so the comparison can measure it on the wire.
      const steps=(typeof LEN_STEPS!=='undefined')?LEN_STEPS[code]:undefined;
      const n=labNote(1,1,0x3C,100,code);
      if(steps!==undefined && steps!==null) n.lenSteps=steps;
      return {suite:'length', id:`len-${k.replace('/','_')}`, patternLength:16,
              lengthLabel:k, lengthCode:code, lengthSteps:steps, expected:[n]};
    });
  }

  // 5. Chord matrix — 1..4 notes on one step, which also exercises the
  // primaries-then-extras trigger-record ordering the DN2 requires.
  function suiteChord(){
    const pitches=[0x3C,0x40,0x43,0x47];
    return [1,2,3,4].map(n=>({
      suite:'chord', id:`chord-${n}`, patternLength:16,
      expected:pitches.slice(0,n).map(pt=>labNote(1,1,pt,100))}));
  }

  // 6. Pattern length matrix — playback range.
  function suitePatternLength(){
    return [16,32,64,128].map(L=>({
      suite:'pattern-length', id:`plen-${L}`, patternLength:L,
      expected:[labNote(1,1,0x3C,100), labNote(1,L,0x3C,100)]}));
  }

  // 7. Multi-track matrix — channel handling across all 16 tracks.
  function suiteMultiTrack(){
    return Array.from({length:16},(_,i)=>({
      suite:'multi-track', id:`track-${i+1}`, patternLength:16,
      expected:[labNote(i+1,1,0x3C,100)]}));
  }

  const BUILDERS = {
    'single-trig':   suiteSingleTrig,
    'parity':        suiteParity,
    'velocity':      suiteVelocity,
    'length':        suiteLength,
    'chord':         suiteChord,
    'pattern-length':suitePatternLength,
    'multi-track':   suiteMultiTrack,
  };

  function suiteNames(){ return LAB_SUITES.slice(); }

  function generateSuite(name, opts){
    const wanted = (name==='all'||!name) ? LAB_SUITES : [name];
    const out=[];
    for(const s of wanted){
      const build=BUILDERS[s];
      if(!build) throw new Error('unknown suite: '+s);
      build(opts).forEach((c,i)=>{ c.slot=allocSlot(s,i); out.push(c); });
    }
    return out;
  }

  // ── Pattern construction ────────────────────────────────────────────
  // Build a pattern object for a case by cloning a loaded dump as the
  // template and replacing its sequencer content. Using a real dump keeps
  // every byte the device set outside step-state/trig-records intact — the
  // same preserve-the-device-bytes principle buildSyxForPattern relies on.
  function templatePattern(){
    const p=(PATTERNS||[]).find(x=>x && x.ok && x._rawMsg);
    if(!p) throw new Error('Load a .syx dump first — the lab needs a device pattern as template.');
    return p;
  }

  function patternForCase(tc){
    const tpl=templatePattern();
    const p=Object.assign({}, tpl);
    p.tracks={}; p.notesAt={}; p.records=[];
    p.patternLength=tc.patternLength||16;
    for(const n of tc.expected){
      const rec={track:n.track, step:n.step, note:n.note, vel:n.vel, len:n.len};
      p.records.push(rec);
      (p.tracks[n.track]=p.tracks[n.track]||[]);
      if(!p.tracks[n.track].includes(n.step)) p.tracks[n.track].push(n.step);
      (p.notesAt[n.track]=p.notesAt[n.track]||{});
      (p.notesAt[n.track][n.step]=p.notesAt[n.track][n.step]||[]).push(rec);
    }
    for(const k of Object.keys(p.tracks)) p.tracks[k].sort((a,b)=>a-b);
    return p;
  }

  // ── Transport ───────────────────────────────────────────────────────
  // ── Receive-slot tracking ───────────────────────────────────────────
  // MANUAL (OS1.10D 13.5.2, p.77): "PATTERN will store a received pattern to
  // the SELECTED pattern slot." The destination is the slot armed on the
  // DEVICE. Byte 9 of the message does NOT choose where a pattern lands --
  // buildSyxForPattern deliberately writes 0 there for exactly this reason.
  //
  // The lab's LAB_SLOT_PLAN is therefore a FICTION unless the armed slot
  // happens to match it. It assigns single-trig base 0, parity base 32, and so
  // on, but the device pays no attention to any of that.
  //
  // HARDWARE-CONFIRMED 2026-09-01, armed at A01 both times:
  //   single-trig  plan base 0  -> selected PC 0..27 = A01..B12. The patterns
  //                really did land from A01, so plan and reality agreed by
  //                coincidence, and it scored 28/28.
  //   parity       plan base 32 -> selected PC 32..35 = C01..C04, but the four
  //                patterns had landed at the armed slot A01 onwards. C01..C04
  //                were empty: 0 captured, 0 unexpected. Four "failures" that
  //                were purely an addressing mistake in the harness.
  //
  // So the lab tracks the receive pointer from the ARMED slot and selects the
  // slot a pattern actually occupies, instead of the one the plan invented.
  let RECV_BASE = 0, RECV_POS = 0;
  function setReceiveBase(slot){ RECV_BASE = RECV_POS = (slot|0)&0x7F; return RECV_BASE; }
  function receiveBase(){ return RECV_BASE; }
  function receivePos(){ return RECV_POS; }
  function noteReceived(){ RECV_POS = (RECV_POS+1)&0x7F; return RECV_POS; }

  async function sendPattern(out, tc){
    const p=patternForCase(tc);
    const bytes=buildSyxForPattern(p);
    // Byte 9 stays 0: the device ignores it for placement. Record where this
    // pattern will ACTUALLY land -- the armed slot, advancing per pattern.
    tc.landedAt = RECV_POS;
    out.send(bytes);
    noteReceived();
    return {bytes:bytes.length, slot:tc.slot, landedAt:tc.landedAt, pattern:p};
  }

  // Select a pattern slot by Program Change.
  //
  // MANUAL-CONFIRMED (Digitone II User Manual OS1.10D, section 8.4, p.24):
  //   "MIDI program change messages 0-127 will select pattern 1-128
  //    (A01-H16) on the Digitone II."
  //
  // So the slot number IS the program number, flat across all eight banks.
  // There is NO Bank Select involved: slot 16 = B01 = PC 16, not bank 1 + PC 0.
  // The manual mentions CC 0 / CC 32 only for MIDI TRACKS addressing external
  // gear (Appendix A, SYN PAGE), never for selecting a DN2 pattern.
  //
  // HARDWARE-CONFIRMED 2026-09-01: the v22.7 single-trig run scored 16/28 with
  // every bank-A case passing and every bank-B case failing. Each failure was
  // the device playing the bank-A pattern at (slot & 15) -- i.e. the old
  // bank-select scheme addressed A01-A12 while the lab believed it had
  // selected B01-B12. All 12 failures were reproduced exactly by that model.
  //
  // Receive is gated by SETTINGS > MIDI CONFIG > SYNC > PRG CH RECEIVE, and the
  // listening channel by PROGRAM CHG IN CH (AUTO = the auto channel).
  let LAB_CHANNEL = 9;                       // 0-based; 9 = displayed channel 10
  function setChannel(displayed){            // accepts the 1-16 number on screen
    LAB_CHANNEL = Math.max(0, Math.min(15, (displayed|0) - 1));
    return LAB_CHANNEL;
  }
  function programChange(out, slot, channel){
    const ch=(channel===undefined?LAB_CHANNEL:channel)&0x0F;
    out.send([0xC0|ch, slot&0x7F]);          // PC 0-127 -> pattern A01-H16
  }

  // ── MIDI clock ──────────────────────────────────────────────────────
  // HARDWARE-CONFIRMED 2026-09-01: START (0xFA) on its own does NOT play.
  // With EXT SYNC enabled, 0xFA only arms the sequencer -- it is the 0xF8
  // clock ticks that actually advance it. Without a clock the DN2 sits
  // silent, captureMidi() returns nothing, and the run looks like a total
  // encoding failure when in fact we never started the transport.
  //
  // MIDI clock is 24 pulses per quarter note, so the tick interval is
  // 60000/(bpm*24) ms. Verified on hardware: 195 ticks per 4s window at
  // 120 BPM against 192 ideal (~1.5% fast, well inside step tolerance).
  const CLOCK_PPQN = 24;
  function clockIntervalMs(bpm){ return 60000/((bpm||120)*CLOCK_PPQN); }
  let CLOCK_TIMER=null, CLOCK_TICKS=0;
  // setInterval cannot hold 20.8ms: browsers clamp and drift, and measured
  // output was less than half rate (11 ticks where 24 were due), which would
  // play the pattern at the wrong tempo and smear every captured timestamp.
  // So schedule against an absolute timeline and emit however many ticks are
  // actually due each wake-up -- the clock then keeps real time even when the
  // timer fires late.
  function startClock(out, bpm){
    stopClock();                             // never run two clocks at once
    if(!out) return 0;
    const iv=clockIntervalMs(bpm);
    CLOCK_TICKS=0;
    const t0=(typeof performance!=='undefined'?performance.now():Date.now());
    // Emit the first tick immediately. The hardware probe ran the clock
    // continuously BEFORE start, and that is what the device expects: if the
    // first tick arrives after 0xFA the sequencer is briefly armed with no
    // clock to advance it.
    out.send([0xF8]); CLOCK_TICKS=1;
    CLOCK_TIMER=setInterval(()=>{
      const now=(typeof performance!=='undefined'?performance.now():Date.now());
      const due=Math.floor((now-t0)/iv)+1;   // +1 for the tick already sent
      while(CLOCK_TICKS<due){ out.send([0xF8]); CLOCK_TICKS++; }
    }, Math.max(1, Math.floor(iv/4)));       // oversample so we never fall behind
    return iv;
  }
  function stopClock(){
    if(CLOCK_TIMER){ clearInterval(CLOCK_TIMER); CLOCK_TIMER=null; }
    return CLOCK_TICKS;
  }
  function clockRunning(){ return CLOCK_TIMER!==null; }
  function clockTicks(){ return CLOCK_TICKS; }

  // ── MIDI capture ────────────────────────────────────────────────────
  // Listen for note on/off with timestamps while the device plays. The
  // harness is clock master, so timestamps quantise cleanly back to steps.
  function captureMidi(inPort, durationMs){
    return new Promise(resolve=>{
      const events=[];
      if(!inPort){ resolve(events); return; }
      const prev=inPort.onmidimessage;
      const t0=performance.now();
      inPort.onmidimessage=ev=>{
        const d=ev.data; if(!d||d.length<3) return;
        const st=d[0]&0xF0, ch=d[0]&0x0F;
        if(st===0x90 && d[2]>0)      events.push({t:performance.now()-t0, ch, note:d[1], vel:d[2], on:true});
        else if(st===0x80||(st===0x90&&d[2]===0)) events.push({t:performance.now()-t0, ch, note:d[1], vel:d[2], on:false});
      };
      setTimeout(()=>{ inPort.onmidimessage=prev; resolve(events); }, durationMs);
    });
  }

  // Quantise captured events back onto sequencer steps. Steps are 1-based,
  // matching the editor and the expectation objects.
  //
  // byChannel stays ON by default: each DN2 track transmits on its own MIDI
  // channel (track 1 -> ch 1 ... track 16 -> ch 16), so channel+1 IS the track
  // and is real observed evidence. The v22.6 report proves it -- single-T16S2
  // came back as T16S2, decoded from channel 16.
  //
  // Do NOT substitute the case's own track here. That would make every report
  // agree with itself by construction and destroy the only signal that catches
  // a trig landing on the wrong track. Where that run showed T16 cases
  // captured as T1, the cause was the pattern-change lag (the device was still
  // playing an earlier, track-1 pattern), not the channel mapping.
  function quantize(events, opts){
    const bpm=(opts&&opts.bpm)||120;
    const t0=(opts&&opts.t0)||0;
    const track=(opts&&opts.track)||1;
    const len=(opts&&opts.patternLength)||0;
    const per=stepDurationMs(bpm);
    const trackOf=e=>(opts&&opts.byChannel!==false&&e.ch!==undefined)?e.ch+1:track;
    // Pair each note-on with its matching note-off so trig LENGTH becomes
    // measurable. captureMidi has always recorded note-offs; until v22.10
    // quantize discarded them, which is why the length suite could not assert
    // anything -- six cases that tested nothing.
    const ons=[];
    for(const e of events){
      if(e.on!==false){ ons.push({e, out:{
        track:trackOf(e), step:Math.round((e.t-t0)/per)+1,
        note:e.note, vel:e.vel, tOn:e.t }}); continue; }
      // note-off: close the most recent unclosed on for this note+channel
      for(let i=ons.length-1;i>=0;i--){
        const c=ons[i];
        if(c.out.lenSteps===undefined && c.e.note===e.note && c.e.ch===e.ch){
          c.out.lenSteps=(e.t-c.out.tOn)/per;
          break;
        }
      }
    }
    let out=ons.map(c=>{
      const o=c.out; delete o.tOn;
      return o;
    });
    // Anything past the pattern's last step is the sequencer having looped;
    // drop it so a late capture cannot invent phantom trigs.
    if(len>0) out=out.filter(e=>e.step>=1 && e.step<=len);
    return out;
  }

  // ── Verification ────────────────────────────────────────────────────
  // Compare on (track, step, note) — velocity and length are checked only
  // when the case declares a concrete value, since INHERIT means "whatever
  // the track default is" and the device is free to choose.
  function keyOf(e){ return e.track+':'+e.step+':'+e.note; }

  // Velocity is compared ONLY when the case declares a concrete value.
  // INHERIT (0xFF) means "whatever the track default is", and the device is
  // free to choose, so asserting on it would be wrong.
  //
  // This was a real blind spot: until v22.10 keyOf was the whole comparison,
  // so a captured velocity of 1 satisfied an expectation of 127. The velocity
  // suite passed 5/5 on hardware while asserting nothing about velocity --
  // the values happened to be right, which is luck, not verification.
  const INHERIT_VEL=0xFF;
  function compare(expected, captured, opts){
    const exp=(expected||[]).slice();
    const got=(captured||[]).slice();
    const gotPool=got.slice();
    const missing=[], wrongVel=[], wrongLen=[];
    // Length tolerance must scale with the expected duration. A fixed +/-0.5
    // steps lets a HALVED 1-step note through (|0.5-1| = 0.5, not > 0.5) while
    // being needlessly strict on a 32-step note. Use the larger of a small
    // absolute floor (MIDI jitter) and a proportion of the expectation.
    //
    // The floor must also stay BELOW the gap between adjacent length codes, or
    // the shortest ones stop discriminating: 1/128 is 0.125 steps and 1/64 is
    // 0.25, a gap of 0.125, so a 0.15 floor accepted either for both. Worst
    // measured jitter across the v22.10 hardware run was 0.030 steps, so 0.06
    // keeps ~2x headroom over noise while still separating the closest pair.
    const absTol=(opts&&opts.lenTolSteps)!==undefined?opts.lenTolSteps:0.06;
    const relTol=(opts&&opts.lenTolFrac)!==undefined?opts.lenTolFrac:0.25;
    for(const e of exp){
      const k=keyOf(e);
      const i=gotPool.findIndex(g=>keyOf(g)===k);
      if(i<0){ missing.push(k); continue; }
      const g=gotPool.splice(i,1)[0];
      // Velocity: only when the case asked for a specific one.
      if(e.vel!==undefined && e.vel!==INHERIT_VEL && g.vel!==undefined && g.vel!==e.vel)
        wrongVel.push(`${k} expected vel ${e.vel} got ${g.vel}`);
      // Length: only when the case declares expected duration in steps AND
      // the capture measured one (needs note-offs).
      if(e.lenSteps!==undefined && g.lenSteps!==undefined){
        const tol=Math.max(absTol, e.lenSteps*relTol);
        if(Math.abs(g.lenSteps-e.lenSteps)>tol)
          wrongLen.push(`${k} expected ${e.lenSteps} steps got ${g.lenSteps.toFixed(2)}`);
      }
    }
    const unexpected=gotPool.map(keyOf);
    return {pass: missing.length===0 && unexpected.length===0 &&
                  wrongVel.length===0 && wrongLen.length===0,
            missing, unexpected, wrongVel, wrongLen,
            expectedCount:exp.length, capturedCount:got.length};
  }

  // ── Results / report ────────────────────────────────────────────────
  function reset(){ RESULTS=[]; ABORT=false; }
  function recordResult(r){ RESULTS.push(r); return r; }
  function results(){ return RESULTS.slice(); }
  function abort(){ ABORT=true; }

  function exportReport(){
    const sent=RESULTS.length;
    const validated=RESULTS.filter(r=>r.pass).length;
    return {
      tool:'DN2 Regression Lab',
      version:(typeof VIZ_VERSION!=='undefined'?VIZ_VERSION:'?'),
      generated:new Date().toISOString(),
      summary:{sent, validated, failures:sent-validated},
      // Random velocities/lengths are chosen from this seed. Re-run with the
      // same seed to reproduce a failure exactly.
      seed: LAB_SEED,
      // What a pass actually rests on. Track IS observed: each DN2 track
      // transmits on its own MIDI channel, so the captured track is decoded
      // from the wire rather than assumed from the case.
      caveats:{
        trackObserved:true,
        velocityCompared:true,
        lengthCompared:true,
        note:'Track is decoded from the MIDI channel of each captured note (track N = channel N). Velocity is compared when the case declares a concrete value (not INHERIT). Length is measured note-on to note-off and compared when the case declares an expected duration.',
      },
      cases:RESULTS.map(r=>({
        id:r.id, suite:r.suite, slot:r.slot, slotLabel:slotLabel(r.slot||0),
        landedAt:(r.landedAt===undefined?null:r.landedAt),
        landedLabel:(r.landedAt===undefined?null:slotLabel(r.landedAt)),
        expected:r.expected||[], captured:r.captured||[],
        pass:!!r.pass, diff:r.diff||null, error:r.error||null,
      })),
    };
  }

  function downloadReport(){
    const json=JSON.stringify(exportReport(), null, 2);
    if(typeof download==='function') download(json, 'dn2lab-report.json', 'application/json');
    return json;
  }

  // ── Run one case end to end ─────────────────────────────────────────
  // send -> program change -> SETTLE -> play -> capture -> quantise -> compare.
  //
  // Hardware run 2026-09-01 (v22.6, single-trig, 0/28) showed the harness was
  // one case behind: 13/27 captures contained the PREVIOUS case's pattern and
  // only 2/27 their own. The DN2 defers a pattern change to a boundary, and
  // the lab pressed play immediately after the Program Change, so it recorded
  // whatever was still loaded. Two changes fix it:
  //   1. the clock free-runs across the whole suite (see runSuite), so the
  //      device keeps a coherent position and the change can land;
  //   2. settleMs of clock time passes between the Program Change and 0xFA.
  async function runCase(tc, ctx){
    const c=ctx||{};
    try{
      if(c.out) await sendPattern(c.out, tc);
      // Select the slot the pattern ACTUALLY landed in (the device's receive
      // pointer), not the slot the plan asked for. Those diverge as soon as
      // the armed base is not 0 -- which is what made the parity suite play
      // four empty slots.
      const playSlot=(tc.landedAt!==undefined)?tc.landedAt:tc.slot;
      if(c.out && c.programChange!==false){ programChange(c.out, playSlot, c.channel); }
      let captured=[];
      if(c.in && c.play!==false){
        const bpm=c.bpm||120;
        // Clock must already be running for the pattern change to take effect
        // on a boundary. runSuite starts it once; a lone runCase starts its own.
        const ownClock=(c.clock!==false) && !clockRunning();
        if(c.out && ownClock) startClock(c.out, bpm);
        // Give the device time to actually switch patterns before playing.
        const settle=(c.settleMs!==undefined)?c.settleMs:stepDurationMs(bpm)*4;
        if(settle>0) await new Promise(r=>setTimeout(r, settle));
        if(c.out) c.out.send([0xFA]);                       // MIDI Start
        const len=tc.patternLength||16;
        // Capture must STOP BEFORE the pattern loops, or the same trig is
        // recorded again a pattern later. The v22.6 tail of 250ms was two
        // whole steps at 120 BPM, which is where the phantom T1S17/T1S18
        // notes came from. Default to a fraction of one step.
        const tail=(c.tail!==undefined)?c.tail:Math.min(120, stepDurationMs(bpm)*0.4);
        const dur=stepDurationMs(bpm)*len + tail;
        try{
          captured=quantize(await captureMidi(c.in, dur),
                            {bpm:bpm, byChannel:c.byChannel!==false,
                             track:c.track||(tc.expected[0]&&tc.expected[0].track)||1,
                             patternLength:len});
        } finally {
          // Always stop transport, even if capture throws. The clock is only
          // torn down here if this case started it.
          if(c.out) c.out.send([0xFC]);                     // MIDI Stop
          if(ownClock) stopClock();
        }
      }
      const cmp=(c.in && c.play!==false) ? compare(tc.expected, captured, {lenTolSteps:c.lenTolSteps})
                                         : {pass:true, missing:[], unexpected:[], skipped:true};
      return recordResult({id:tc.id, suite:tc.suite, slot:tc.slot, landedAt:tc.landedAt,
        expected:tc.expected, captured, pass:cmp.pass, diff:cmp});
    }catch(e){
      return recordResult({id:tc.id, suite:tc.suite, slot:tc.slot, landedAt:tc.landedAt,
        expected:tc.expected, captured:[], pass:false, error:(e.message||String(e))});
    }
  }

  // Run a whole suite. Pacing mirrors sequential send: the device stays in
  // RECEIVE and auto-advances, so a gap is all that is needed between cases.
  //
  // The clock free-runs for the WHOLE suite rather than being restarted per
  // case. A restarted clock resets the device's sense of position, so a
  // deferred pattern change never lands on the boundary it is waiting for --
  // which is what left the v22.6 hardware run a full case behind.
  async function runSuite(name, ctx){
    const c=ctx||{};
    if(RUNNING) throw new Error('a lab run is already in progress');
    RUNNING=true; reset();
    // Seed the value generators. Random velocities and lengths catch what
    // fixed ones cannot, but the seed is recorded so any failure is replayable.
    setSeed(c.seed!==undefined ? c.seed : (Date.now()>>>0));
    const wantClock=(c.clock!==false) && c.out && (c.play!==false) && c.in;
    try{
      const cases=generateSuite(name, c);
      // The device stores to the slot it is ARMED at and auto-advances, so a
      // run must start from where the user actually armed it.
      setReceiveBase(c.receiveBase!==undefined ? c.receiveBase : 0);
      if(wantClock) startClock(c.out, c.bpm||120);
      for(let i=0;i<cases.length;i++){
        if(ABORT) break;
        if(typeof c.onProgress==='function') c.onProgress(i, cases.length, cases[i]);
        await runCase(cases[i], c);
        if(i<cases.length-1) await new Promise(r=>setTimeout(r, c.gapMs||500));
      }
      return exportReport();
    } finally {
      if(wantClock){ stopClock(); if(c.out) c.out.send([0xFC]); }
      RUNNING=false;
    }
  }

  return {generateSuite, suiteNames, runCase, runSuite, sendPattern, programChange,
          setChannel, startClock, stopClock, clockTicks, clockIntervalMs, clockRunning,
          setSeed, seed, makeRng,
          setReceiveBase, receivePos,
          captureMidi, quantize, compare, exportReport, downloadReport,
          recordResult, results, reset, abort, slotLabel, stepDurationMs,
          patternForCase, isRunning:()=>RUNNING};
})();

if(typeof window!=='undefined') window.DN2LAB = DN2LAB;

// Expert entry point. Keeps the toolbar uncluttered while making the lab and
// the payload diagnostics reachable without the console.
function showToolsMenu(){
  const haveDump=(PATTERNS||[]).some(p=>p&&p.ok&&p._rawMsg);
  showModal('Tools',
    'Expert tools. The regression lab validates the real path: editor \u2192 buildSyxForPattern \u2192 WebMIDI \u2192 DN2 \u2192 capture.',
    [
      {label:'DN2 Regression Lab', desc:haveDump?'Hardware-in-the-loop suites with pass/fail report.':'Load a .syx dump first \u2014 the lab needs a pattern template.',
       fn:()=>{ closeModal(); showLabMenu(); }},
      {label:'Diagnose step-state', desc:'Raw byte pairs per step for the current pattern.',
       fn:()=>{ closeModal(); showStepStateDiag(); }},
      {label:'Compare payloads (A vs B)', desc:'Byte-diff a device dump against the app build.',
       fn:()=>{ closeModal(); showComparePicker(); }},
      {label:'Close', desc:'', fn:()=>closeModal()},
    ]);
}

function showLabMenu(){
  const suiteOpts=['all'].concat(DN2LAB.suiteNames())
    .map(s=>'<option value="'+s+'">'+esc(s)+'</option>').join('');
  let portOpts='<option value="">(loading...)</option>';
  let inOpts='<option value="">(loading...)</option>';
  (async ()=>{
    try{
      if(!MIDI_ACCESS) await ensureMidi();
      const outs=[...MIDI_ACCESS.outputs.values()];
      const ins=[...MIDI_ACCESS.inputs.values()];
      portOpts=outs.length?outs.map((o,i)=>'<option value="'+i+'">'+esc(o.name)+'</option>').join('')
                          :'<option value="">(no output ports)</option>';
      inOpts=ins.length?ins.map((o,i)=>'<option value="'+i+'">'+esc(o.name)+'</option>').join('')
                       :'<option value="">(no input ports)</option>';
    }catch(e){ portOpts=inOpts='<option value="">(MIDI unavailable)</option>'; }
    const po=document.getElementById('labOutSel'), pi=document.getElementById('labInSel');
    if(po) po.innerHTML=portOpts;
    if(pi) pi.innerHTML=inOpts;
  })();

  showModal('DN2 Regression Lab',
    'Hardware-in-the-loop validation of editor \u2192 buildSyxForPattern \u2192 WebMIDI \u2192 DN2 \u2192 capture.<br>'+
    '<b>1.</b> Load a .syx dump (used as the pattern template).<br>'+
    '<b>2.</b> On the device: <b>SETTINGS &gt; SYSEX DUMP &gt; RECEIVE PATTERN</b> \u2014 leave it there, it auto-advances.<br>'+
    '<b>3.</b> Run a suite. Playback capture needs the DN2 MIDI out wired back in.',
    [
      {label:'Run suite', desc:'Generate, send, play and verify.', fn:()=>startLabRun()},
      {label:'Preview cases', desc:'List what the selected suite would send \u2014 no MIDI.', fn:()=>previewLabSuite()},
      {label:'Download report', desc:'Export the last run as report.json.', fn:()=>{ DN2LAB.downloadReport(); }},
      {label:'Close', desc:'', fn:()=>{ DN2LAB.abort(); closeModal(); }},
    ],
    '<div class="ctl" style="margin-bottom:10px"><label style="font-size:11px;color:var(--muted)">SUITE</label><select id="labSuiteSel">'+suiteOpts+'</select></div>'+
    '<div class="ctl" style="margin-bottom:10px"><label style="font-size:11px;color:var(--muted)">OUTPUT PORT</label><select id="labOutSel">'+portOpts+'</select></div>'+
    '<div class="ctl" style="margin-bottom:10px"><label style="font-size:11px;color:var(--muted)">INPUT PORT (capture)</label><select id="labInSel">'+inOpts+'</select></div>'+
    '<div class="ctl" style="margin-bottom:10px"><label style="font-size:11px;color:var(--muted)" title="Higher = faster runs. 180 BPM is a 16-step case in 1.33s instead of 2s; the clock is scheduled on an absolute timeline so the shorter tick stays accurate.">BPM</label><input id="labBpm" type="number" min="30" max="300" value="180" style="width:80px">'+
      '<label style="font-size:11px;color:var(--muted);margin-left:12px">GAP (ms)</label><input id="labGap" type="number" min="0" max="8000" step="50" value="500" style="width:80px">'+
      '<label style="font-size:11px;color:var(--muted);margin-left:12px" title="SETTINGS &gt; MIDI CONFIG &gt; CHANNELS &gt; AUTO CHANNEL. A wrong value fails SILENTLY - the device just ignores the pattern change.">AUTO CH</label><input id="labChan" type="number" min="1" max="16" value="10" style="width:60px">'+
      '<label style="font-size:11px;color:var(--muted);margin-left:12px" title="Clock time between the program change and START. The DN2 defers pattern changes to a boundary; too short and the lab records the PREVIOUS pattern.">SETTLE (ms)</label><input id="labSettle" type="number" min="0" max="8000" step="50" value="1000" style="width:80px"></div>'+
    '<div class="ctl" style="margin-bottom:10px"><label style="font-size:11px;color:var(--muted)" title="The slot the DEVICE is armed at in SYSEX DUMP > RECEIVE PATTERN. Patterns land there and auto-advance - byte 9 does NOT choose the destination. If this is wrong the lab plays empty slots.">ARMED AT SLOT</label><input id="labRecvBase" type="number" min="0" max="127" value="0" style="width:70px">'+
      '<span id="labRecvLbl" style="font-size:11px;color:var(--muted);margin-left:8px">A01</span>'+
      '<label style="font-size:11px;color:var(--muted);margin-left:12px" title="Velocities and trig lengths are randomised per run. Leave blank for a new random seed; paste a previous run\'s seed to reproduce it exactly.">SEED</label><input id="labSeed" type="number" min="0" placeholder="random" style="width:110px"></div>'+
    '<div class="ctl" style="margin-bottom:10px">'+
      '<label style="font-size:11px;margin-right:12px"><input type="checkbox" id="labPlay" checked> Play + capture (unchecked = send only)</label>'+
      '<label style="font-size:11px;margin-right:12px" title="The DN2 needs an external clock: 0xFA alone only arms the sequencer."><input type="checkbox" id="labClock" checked> Send MIDI clock</label>'+
      '<label style="font-size:11px"><input type="checkbox" id="labDense"> Dense single-trig (all 16\\u00d7128)</label>'+
    '</div>'+
    '<div id="labProgress" class="rxbox" style="display:none">'+
      '<div class="rxline"><span id="labPhase">ready</span><span id="labCount"></span></div>'+
      '<div class="rxbar"><div id="labFill" class="rxfill" style="width:0%"></div></div>'+
      '<div class="rxlog" id="labLog"></div>'+
      '<div style="margin-top:8px;text-align:right"><button id="labStopBtn" onclick="DN2LAB.abort()" class="warn" style="display:none;font-size:11px">\u23f9 Stop</button></div>'+

function labLog(msg){
  const log=document.getElementById('labLog');
  if(!log) return;
  const d=document.createElement('div'); d.textContent=msg;
  log.appendChild(d); log.scrollTop=log.scrollHeight;
}

function previewLabSuite(){
  const name=document.getElementById('labSuiteSel').value;
  const dense=!!(document.getElementById('labDense')||{}).checked;
  let cases;
  try{ cases=DN2LAB.generateSuite(name,{dense}); }
  catch(e){ alert(e.message||String(e)); return; }
  const box=document.getElementById('labProgress');
  if(box) box.style.display='';
  const log=document.getElementById('labLog');
  if(log) log.innerHTML='';
  labLog(cases.length+' case(s) in "'+name+'"');
  cases.slice(0,60).forEach(c=>labLog('  '+c.id+'  \u2192 slot '+DN2LAB.slotLabel(c.slot)+
    '  ('+c.expected.length+' note(s), len '+(c.patternLength||16)+')'));
  if(cases.length>60) labLog('  \u2026 '+(cases.length-60)+' more');
}

async function startLabRun(){
  const name=document.getElementById('labSuiteSel').value;
  const outIdx=+document.getElementById('labOutSel').value;
  const inIdx=document.getElementById('labInSel').value;
  const bpm=Math.max(30,Math.min(300,parseInt(document.getElementById('labBpm').value,10)||120));
  const gapMs=Math.max(0,Math.min(8000,parseInt(document.getElementById('labGap').value,10)||500));
  // AUTO CHANNEL is displayed 1-16 on the device. Hardware-confirmed: a wrong
  // value fails silently, so it is surfaced in the UI rather than hardcoded.
  const chan=Math.max(1,Math.min(16,parseInt(document.getElementById('labChan').value,10)||10));
  const settleMs=Math.max(0,Math.min(8000,parseInt((document.getElementById('labSettle')||{}).value,10)||1000));
  const receiveBase=Math.max(0,Math.min(127,parseInt((document.getElementById('labRecvBase')||{}).value,10)||0));
  const seedRaw=(document.getElementById('labSeed')||{}).value;
  const seed=(seedRaw===''||seedRaw===undefined)?undefined:(parseInt(seedRaw,10)>>>0);
  const clock=!!(document.getElementById('labClock')||{checked:true}).checked;
  const play=!!document.getElementById('labPlay').checked;
  const dense=!!document.getElementById('labDense').checked;

  if(!(PATTERNS||[]).some(p=>p&&p.ok&&p._rawMsg)){ alert('Load a .syx dump first \u2014 the lab needs a device pattern as template.'); return; }
  if(isNaN(outIdx)){ alert('No MIDI output port selected.'); return; }

  try{ if(!MIDI_ACCESS) await ensureMidi(); }catch(e){ alert(e.message||String(e)); return; }
  const outs=[...MIDI_ACCESS.outputs.values()], ins=[...MIDI_ACCESS.inputs.values()];
  const out=outs[outIdx];
  const inPort=(play && inIdx!=='' && !isNaN(+inIdx)) ? ins[+inIdx] : null;
  if(play && !inPort){ alert('Playback capture needs an input port \u2014 pick one or uncheck Play + capture.'); return; }

  const box=document.getElementById('labProgress');
  const phase=document.getElementById('labPhase');
  const fill=document.getElementById('labFill');
  const stop=document.getElementById('labStopBtn');
  const log=document.getElementById('labLog');
  if(box) box.style.display='';
  if(log) log.innerHTML='';
  if(stop) stop.style.display='';
  labLog('Suite "'+name+'" \u00b7 '+bpm+' BPM \u00b7 '+gapMs+'ms gap \u00b7 '+settleMs+'ms settle \u00b7 auto ch '+chan+
         ' \u00b7 '+(clock?'clock on':'NO clock')+' \u00b7 '+(play?'play + capture':'send only'));
  labLog('Device must be armed at '+DN2LAB.slotLabel(receiveBase)+
         ' in SYSEX DUMP \u203a RECEIVE PATTERN \u2014 patterns land there and auto-advance.');
  try{
    const n=DN2LAB.generateSuite(name,{dense}).length;
    labLog(n+' pattern(s) \u2192 '+DN2LAB.slotLabel(receiveBase)+'..'+DN2LAB.slotLabel(receiveBase+n-1)+
           ' (these slots WILL be overwritten)');
    if(receiveBase+n>128) labLog('\u26a0 This run needs '+n+' slots but only '+(128-receiveBase)+
                                 ' remain past '+DN2LAB.slotLabel(receiveBase)+'. Arm lower.');
  }catch(e){ /* preview is advisory only */ }
  if(play && !clock) labLog('\u26a0 Clock off: the DN2 will not advance, so capture will be empty.');
  if(play && settleMs<250) labLog('\u26a0 Short settle: the device may still be on the previous pattern.');

  try{
    const report=await DN2LAB.runSuite(name, {
      out, in:inPort, bpm, gapMs, play, dense, channel:chan-1, clock, settleMs, receiveBase, seed,
      onProgress:(i,total,tc)=>{
        if(phase) phase.textContent='case '+(i+1)+'/'+total+'\u2026';
        if(fill) fill.style.width=Math.round(i/total*100)+'%';
        labLog('\u2192 '+tc.id+'  slot '+DN2LAB.slotLabel(tc.slot)+
               (tc.landedAt!==undefined && tc.landedAt!==tc.slot
                 ? '  (lands '+DN2LAB.slotLabel(tc.landedAt)+')' : ''));
      },
    });
    if(fill) fill.style.width='100%';
    if(phase) phase.textContent='done';
    for(const c of report.cases) if(!c.pass)
      labLog('  \u2717 '+c.id+(c.error?(' \u2014 '+c.error)
        :(' \u2014 '+[c.diff&&c.diff.missing.length?'missing '+c.diff.missing.length:'',
                     c.diff&&c.diff.unexpected.length?'unexpected '+c.diff.unexpected.length:'',
                     c.diff&&c.diff.wrongVel&&c.diff.wrongVel.length?'vel: '+c.diff.wrongVel[0]:'',
                     c.diff&&c.diff.wrongLen&&c.diff.wrongLen.length?'len: '+c.diff.wrongLen[0]:'']
                    .filter(Boolean).join(' \u00b7 '))));
    labLog('\u2500\u2500 Patterns sent: '+report.summary.sent+
           ' \u00b7 validated: '+report.summary.validated+
           ' \u00b7 failures: '+report.summary.failures);
    labLog('seed '+report.seed+' \u2014 re-enter it to reproduce this exact run.');
    labLog('Use "Download report" for report.json. Now cancel RECEIVE on the device.');
    document.getElementById('status').textContent=
      'Lab: '+report.summary.validated+'/'+report.summary.sent+' passed';
  }catch(e){
    if(phase) phase.textContent='failed';
    labLog('FATAL: '+(e.message||String(e)));
  }finally{
    if(stop) stop.style.display='none';
  }
}

function verifyRoundTrip(){
  const p=PATTERNS.find(x=>x.ok);
  if(!p||!p._rawMsg) return;
  if(!roundTripVerify(p))
    console.warn('Round-trip FAILED — edits may produce bad files');
}
